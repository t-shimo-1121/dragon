<!doctype html>
<!--
  ドラゴン魔石表（GitHub Pages：index.html）
  ・ドラゴンを足す時は script 内の D の配列に1行足すだけ。ランキングや比較は自動で計算されます
  ・画像は images/ の中に No. と同じ2桁の番号で置きます
      images/icons/01.png … 魔石アイコン　images/models/01.png … 3Dモデル　images/illust/01.png … デフォルメイラスト
  ・デザインは「旅行のしおり集」（t-shimo-1121/shiori）に合わせています
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<title>ドラゴン魔石表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap">
<style>
/* Layout: しおり集と同じ「紙と札」。1列のカードに大きなアイコンと六角形、数値は六角形の頂点に。iPhone SE（375px）基準 */
:root{
  --paper:hsl(40 30% 94%);
  --sheet:hsl(40 46% 99%);
  --ink:hsl(40 20% 16%);
  --mute:hsl(40 10% 40%);
  --line:hsl(40 22% 84%);
  --accent:hsl(205 45% 34%);
  --soft:hsl(205 45% 93%);
  --tint:hsl(40 34% 90%);
  --dots:hsla(40,25%,45%,.10);
  --radar:hsl(140 55% 40%);
  --grid:hsl(40 18% 80%);
  --f-head:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
  /* ランク色（ゲームの配色） */
  --rS:hsl(278 70% 60%);--rA:hsl(44 95% 46%);--rB:hsl(207 78% 56%);--rC:hsl(24 88% 56%);
  --rD:hsl(330 62% 62%);--rE:hsl(187 70% 44%);--rF:hsl(106 46% 50%);--rG:hsl(0 0% 62%);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:hsl(40 12% 11%);--sheet:hsl(40 11% 15%);--ink:hsl(40 18% 93%);--mute:hsl(40 8% 66%);
  --line:hsl(40 10% 27%);--accent:hsl(205 50% 66%);--soft:hsl(205 30% 20%);--tint:hsl(40 12% 19%);
  --dots:hsla(40,20%,70%,.07);--radar:hsl(140 50% 52%);--grid:hsl(40 10% 32%);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:hsl(40 12% 11%);--sheet:hsl(40 11% 15%);--ink:hsl(40 18% 93%);--mute:hsl(40 8% 66%);
  --line:hsl(40 10% 27%);--accent:hsl(205 50% 66%);--soft:hsl(205 30% 20%);--tint:hsl(40 12% 19%);
  --dots:hsla(40,20%,70%,.07);--radar:hsl(140 50% 52%);--grid:hsl(40 10% 32%);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--dots) 1.1px,transparent 1.1px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1em;height:1em;display:inline-block;fill:currentColor;flex:none}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--line)}

/* 見出し */
header{padding-block:16px 4px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--f-head);font-weight:900;font-size:clamp(1.7rem,7vw,2.3rem);line-height:1.2;margin:0;letter-spacing:.04em}
.tally{display:flex;gap:18px;margin:0}
.tally div{display:flex;flex-direction:column}
.tally dt{font-size:.74rem;color:var(--mute);font-weight:700}
.tally dd{margin:0;font-family:var(--f-head);font-weight:700;font-size:1.2rem;line-height:1.2;font-variant-numeric:tabular-nums}
.tally small{font-size:.76rem;font-weight:500;margin-left:2px}

/* タブ（アイコン＋文字の札） */
nav.views{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--paper) 86%,transparent);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;padding-block:8px 12px;margin-bottom:6px}
nav.views button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border:1px solid var(--line);border-radius:12px;
  background:var(--sheet);color:var(--mute);font-weight:700;font-size:clamp(.66rem,3.3vw,.92rem);line-height:1.15;min-width:0;letter-spacing:-.02em}
nav.views button .ic{font-size:1.4em}
nav.views button[aria-selected="true"]{background:var(--accent);border-color:transparent;color:var(--sheet);box-shadow:0 4px 12px hsla(40,30%,25%,.22)}

h2{font-family:var(--f-head);font-size:1.25rem;margin:22px 0 10px;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2:first-child{margin-top:4px}
h2 .tg{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--sheet);font-size:1.05rem;flex:none}
h2 .n{font-family:var(--f-body);font-size:.82rem;color:var(--mute);font-weight:500;margin-left:auto}
.hint{color:var(--mute);font-size:.86rem;margin:-4px 0 12px}

/* 並べ替え・絞り込みの札 */
.sorter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sorter button{border:1px solid var(--line);background:var(--sheet);border-radius:11px;padding:5px 12px;font-size:.92rem;font-weight:700;color:var(--ink)}
.sorter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.sorter button small{font-size:.74rem;margin-left:5px;opacity:.7;font-variant-numeric:tabular-nums}
.imgset{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.84rem;color:var(--mute);font-weight:700;margin:-4px 0 12px}
.imgset .sorter{margin:0}
.imgset .sorter button{font-size:.84rem;padding:3px 10px}

/* イラスト枠 */
.illust{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--tint);display:grid;place-items:center}
.illust img{width:100%;height:100%;object-fit:contain;display:block}
.illust.icon img{object-fit:cover}
.illust .ph{display:none;text-align:center;color:var(--mute);font-size:.72rem;line-height:1.35;padding:6px}
.illust.empty{border:2px dashed var(--line)}
.illust.empty .ph{display:block}
.illust .ph .ic{font-size:1.8rem;display:block;margin:0 auto 4px}

/* ドラゴン一覧のカード */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.card{display:block;width:100%;text-align:left;padding:10px 12px 8px;color:inherit}
.card:active{transform:scale(.99)}
.card-h{display:flex;align-items:baseline;gap:8px;min-width:0}
.card-h .no{font-size:.8rem;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums;flex:none}
.card-h .nk{font-family:var(--f-head);font-weight:900;font-size:1.45rem;line-height:1.2;white-space:nowrap}
.card-h .tot{margin-left:auto;font-size:.78rem;color:var(--mute);font-weight:700;white-space:nowrap}
.card-h .tot b{font-family:var(--f-head);font-weight:900;font-size:1.35rem;color:var(--ink);margin-left:3px;font-variant-numeric:tabular-nums}
.card .sp{font-size:.82rem;color:var(--mute);line-height:1.3;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-b{display:grid;grid-template-columns:minmax(0,35fr) minmax(0,65fr);gap:4px;align-items:center;margin-top:4px}
.card .sortv{color:var(--accent);font-weight:700}

/* 六角形グラフ */
.radar{display:block;width:100%;height:auto}
.radar .lb{fill:var(--mute);font-family:var(--f-body);font-weight:700}
.radar .vl{fill:var(--ink);font-family:var(--f-head);font-weight:900}
.radar .rkt{fill:#fff;font-family:var(--f-head);font-weight:900}
.radar .frame{fill:var(--tint);stroke:var(--grid);stroke-width:1.5}
.radar .gl{fill:none;stroke:var(--grid);stroke-width:1}
.radar .area{fill:var(--radar);fill-opacity:.35;stroke:var(--radar);stroke-width:2.5;stroke-linejoin:round}

/* ランク札（文字） */
.rk{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:6px;font-family:var(--f-head);font-weight:900;font-size:.82rem;line-height:1;color:#fff;flex:none}
.rk.S{background:var(--rS)}.rk.A{background:var(--rA)}.rk.B{background:var(--rB)}.rk.C{background:var(--rC)}
.rk.D{background:var(--rD)}.rk.E{background:var(--rE)}.rk.F{background:var(--rF)}.rk.G{background:var(--rG)}

/* 個別ページ */
.dnav{display:flex;gap:6px;align-items:center;margin:2px 0 10px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:11px;padding:7px 12px;font-weight:700;font-size:.92rem;white-space:nowrap;box-shadow:0 2px 0 var(--line)}
.dnav .sp{flex:1}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.detail{grid-template-columns:1fr}}
.dpanel{padding:14px;min-width:0}
.d-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.d-h h3{margin:0;font-family:var(--f-head);font-weight:900;font-size:2rem;line-height:1.2}
.d-h .sp{color:var(--mute);font-weight:700;font-size:.92rem}
.d-h .tot{margin-left:auto;font-size:.85rem;color:var(--mute);font-weight:700}
.d-h .tot b{font-family:var(--f-head);font-weight:900;font-size:1.7rem;color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.d-art{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;margin-top:8px}
@media (max-width:520px){.d-art{grid-template-columns:1fr}.d-art .illust{width:58%;margin:0 auto}}
.d-sec{font-family:var(--f-head);font-weight:700;font-size:1.05rem;margin:14px 0 6px;display:flex;align-items:center;gap:6px;color:var(--accent)}
.d-sec:first-child{margin-top:0}
.kv{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kv li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--tint);border-radius:10px;font-weight:700;font-size:1.05rem}
.kv li.none{color:var(--mute);font-weight:500;background:none;border:1px dashed var(--line)}
.kv .lv{font-size:.82rem;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ランキング（しおり集と同じ型） */
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin-bottom:6px}
.rank{overflow:hidden}
.rank-h{display:flex;align-items:center;gap:.55rem;padding:.6rem .8rem;background:var(--soft);border-bottom:1px dashed var(--line)}
.rank-h .tg{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--accent);color:var(--sheet);font-size:.95rem;flex:none}
.rank-t{font-family:var(--f-head);font-weight:700;font-size:1.08rem;line-height:1.3}
.rank-u{margin-left:auto;font-size:.74rem;color:var(--mute);text-align:right;line-height:1.3}
.rank ol{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:1.9rem 2.6rem minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:.5rem .8rem;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank li.go{cursor:pointer}
.pos{display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;font-family:var(--f-head);font-weight:900;font-size:.95rem;
  background:var(--tint);color:var(--mute);font-variant-numeric:tabular-nums}
.pos.r1{background:hsl(45 80% 52%);color:hsl(40 40% 12%)}.pos.r2{background:hsl(210 10% 72%);color:hsl(210 20% 14%)}.pos.r3{background:hsl(25 55% 55%);color:hsl(25 40% 10%)}
.rank .illust{width:2.6rem;border-radius:8px}
.rank .illust .ph{display:none!important}
.rank li.noimg{grid-template-columns:1.9rem minmax(0,1fr) auto}
.rn{font-weight:700;font-size:1.02rem;min-width:0;line-height:1.35}
.rs{display:block;font-size:.76rem;color:var(--mute);font-weight:500;line-height:1.4}
.rv{text-align:right;font-family:var(--f-head);font-weight:900;font-size:1.2rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.rv small{font-family:var(--f-body);font-weight:500;font-size:.72rem;color:var(--mute);margin-left:2px}

/* 一覧表 */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:.76rem;color:var(--mute);font-weight:700;background:var(--sheet)}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:3px}
th button::after{content:"↕";opacity:.35}
th[aria-sort] button{color:var(--ink)}
th[aria-sort="ascending"] button::after{content:"↑";opacity:1;color:var(--accent)}
th[aria-sort="descending"] button::after{content:"↓";opacity:1;color:var(--accent)}
td.nm,th.nm{position:sticky;left:0;background:var(--sheet);z-index:1;box-shadow:1px 0 0 var(--line)}
td.nm{font-weight:700}
.nmw{display:flex;align-items:center;gap:8px}
.nmw .illust{width:2.2rem;border-radius:7px;flex:none}
.nmw .illust .ph{display:none!important}
tbody tr{cursor:pointer}
td.num{text-align:right}
.cv{display:inline-flex;align-items:center;gap:6px}
.best{background:hsl(45 90% 60% / .35);border-radius:5px;padding:0 4px}
td.dim{opacity:.3}
tr.hit td{background:var(--soft)}
td .lvn{font-size:.78rem;color:var(--accent);font-weight:700;margin-left:4px}
/* 得意フィールド・弱点の札 */
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:1px;min-width:0}
.sp-row .sp{margin:0;min-width:0}
.fw{display:flex;gap:8px;flex:none}
.d-h+.fw{margin-top:6px}
.fw-i{display:inline-flex;align-items:center;gap:3px}
.fw-i small{font-size:.7rem;color:var(--mute);font-weight:700}
.el,.fd{display:inline-block;font-size:.8rem;font-weight:700;line-height:1.5;padding:0 7px;border-radius:6px;color:#fff;background:var(--mute);white-space:nowrap}
.e-fire{background:hsl(8 72% 50%)}.e-water{background:hsl(208 70% 48%)}.e-earth{background:hsl(30 50% 42%)}
.e-wind{background:hsl(150 50% 36%)}.e-light{background:hsl(44 90% 42%)}.e-dark{background:hsl(275 40% 45%)}
.f-waste{background:hsl(68 45% 38%)}.f-water{background:hsl(195 65% 42%)}.f-forest{background:hsl(130 40% 34%)}.f-rock{background:hsl(35 30% 42%)}
/* ドラゴンを選ぶ帯 */
.pick{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 8px;scrollbar-width:thin}
.pick button{flex:none;width:4.6rem;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);font-size:.74rem;font-weight:700;line-height:1.2}
.pick button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .illust{width:3rem;border-radius:8px}
.pick .illust .ph{display:none!important}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
/* スキル */
.skp{padding:12px}
.skp-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.skp-h .illust{width:3.2rem;flex:none}
.skp-h b{display:block;font-family:var(--f-head);font-weight:900;font-size:1.4rem;line-height:1.2}
.skp-h small{color:var(--mute);font-size:.82rem;font-weight:700}
.sk{border-top:1px dashed var(--line);padding:10px 0 8px}
.sk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sk-h b{font-size:1.15rem}
.lvb{font-size:.78rem;font-weight:700;color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}
.lvb.max{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.sts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px;margin-top:6px}
.st{background:var(--tint);border-radius:9px;padding:4px 2px 5px;text-align:center;min-width:0}
.st small{display:block;font-size:.66rem;color:var(--mute);font-weight:700;line-height:1.3}
.st b{display:block;font-family:var(--f-head);font-weight:900;font-size:1.05rem;line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
.st b .el{font-size:.78rem;padding:0 5px}
.st.chg{background:hsl(45 95% 62% / .45);box-shadow:inset 0 0 0 1.5px hsl(40 85% 45% / .6)}
mark{background:hsl(45 95% 62% / .55);color:inherit;border-radius:3px;padding:0 2px;font-weight:700}
.eff{margin:7px 0 0;font-size:.95rem;line-height:1.55}
.eff.none{color:var(--mute);font-size:.85rem}
.eff .src{display:block;font-size:.7rem;color:var(--mute)}
.note{margin:4px 0 0;font-size:.78rem;color:var(--mute);line-height:1.5}
.note b{color:var(--ink);margin-right:6px}
.nodata{margin:6px 0 0;font-size:.85rem;color:var(--mute);border:1px dashed var(--line);border-radius:9px;padding:6px 10px}
/* アビリティ */
.abgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.abc{padding:10px 12px}
.abc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.abc-h b{font-size:1.15rem}
.abc-h .cnt{font-size:.8rem;color:var(--mute);font-weight:700}
.ab-b{display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:8px;align-items:start;margin-top:6px}
.ab-b .eff{margin:0}
.holds{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.hold{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--sheet);border-radius:9px;padding:2px 4px 2px 8px;font-size:.84rem;font-weight:700}
.hold .lvb{font-size:.68rem;padding:0 6px}
/* 情報 */
.info{padding:14px}
.info-h{display:flex;align-items:center;gap:12px}
.info-h .illust{width:5rem;flex:none}
.info-h small{display:block;color:var(--mute);font-size:.78rem;font-weight:700}
.info-h b{display:block;font-family:var(--f-head);font-weight:900;font-size:1.35rem;line-height:1.25}
.info-h span{font-size:.9rem;color:var(--mute);font-weight:700}
.info-t{margin:12px 0 0;font-family:var(--f-head);font-weight:900;font-size:1.1rem;color:var(--accent)}
.info-d{margin:6px 0 0;font-size:1rem;line-height:1.75}
.facts{margin:12px 0 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.facts div{background:var(--tint);border-radius:10px;padding:6px 10px;min-width:0}
.facts dt{font-size:.72rem;color:var(--mute);font-weight:700}
.facts dd{margin:0;font-weight:700;font-size:.95rem;line-height:1.45}
.foot{margin-top:26px;color:var(--mute);font-size:.8rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

/* ===== 六角形グラフ：頂点の外側に「能力名」と「ランク・数値」 ===== */
function radar(d,{W=250,R=66}={}){
  const H=Math.round(R*2+86),cx=W/2,cy=H/2+1;
  const pt=(i,f)=>{const a=(-90+60*i)*Math.PI/180;return[cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
  const poly=f=>[0,1,2,3,4,5].map(i=>pt(i,f).map(n=>n.toFixed(1)).join(",")).join(" ");
  let s=`<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.nk)}の能力：${d.st.map((x,i)=>STATS[i]+x.r+x.v).join("、")}">`;
  s+=`<polygon class="frame" points="${poly(1)}"/>`;
  [1/3,2/3].forEach(f=>s+=`<polygon class="gl" points="${poly(f)}"/>`);
  for(let i=0;i<6;i++){const[x,y]=pt(i,1);s+=`<line class="gl" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}
  s+=`<polygon class="area" points="${d.st.map((x,i)=>pt(i,Math.max(.04,x.v/999)).map(n=>n.toFixed(1)).join(",")).join(" ")}"/>`;
  /* ラベル：上下は中央そろえ、左右は頂点の外側に */
  const B=18,FV=16,FL=12.5;            // ランク札の大きさ・数値と能力名の文字サイズ
  d.st.forEach((x,i)=>{
    const[vx,vy]=pt(i,1);
    let ax,top;                           // ax=ラベル塊の中心x、top=能力名の上端
    if(i===0){ax=vx;top=vy-8-FL-B-4}
    else if(i===3){ax=vx;top=vy+8}
    else{const side=i<3?1:-1;ax=vx+side*(7+26);top=vy-(FL+B+4)/2}
    const bw=B+4+FV*1.9;                  // 札＋数値の幅
    const bx=ax-bw/2,by=top+FL+3;
    s+=`<text class="lb" x="${ax.toFixed(1)}" y="${(top+FL-1).toFixed(1)}" font-size="${FL}" text-anchor="middle">${STATS[i]}</text>`;
    s+=`<rect x="${bx.toFixed(1)}" y="${by.toFixed(1)}" width="${B}" height="${B}" rx="4" fill="var(--r${x.r})"/>`;
    s+=`<text class="rkt" x="${(bx+B/2).toFixed(1)}" y="${(by+B/2+4.6).toFixed(1)}" font-size="13.5" text-anchor="middle">${x.r}</text>`;
    s+=`<text class="vl" x="${(bx+B+3).toFixed(1)}" y="${(by+B/2+5.4).toFixed(1)}" font-size="${FV}">${x.v}</text>`;
  });
  return s+"</svg>";
}

function valOf(d,key){
  if(key==="no")return d.no;if(key==="total")return d.total;
  const i=+key.slice(1);
  if(key[0]==="s")return d.st[i].v;
  if(key[0]==="k")return d.sk[i].n;
  if(key[0]==="a")return d.ab[i].n;
}
function sorted(s){
  return [...D].sort((a,b)=>{const x=valOf(a,s.key),y=valOf(b,s.key);
    const c=typeof x==="string"?x.localeCompare(y,"ja"):x-y;return (c||a.no-b.no)*s.dir});
}
function toggle(s,key,defDir){if(s.key===key)s.dir*=-1;else{s.key=key;s.dir=defDir}save();render()}
const ariaSort=(s,k)=>s.key===k?` aria-sort="${s.dir>0?"ascending":"descending"}"`:"";

/* ===== ランキング：同点は同じ順位、5位までを表示 ===== */
function top5(items){
  const arr=[...items].sort((a,b)=>b.v-a.v||(a.tie??0)-(b.tie??0));
  let pos=0,prev=null;
  return arr.map((x,i)=>{if(x.v!==prev){pos=i+1;prev=x.v}return{...x,pos}}).filter(x=>x.pos<=5);
}
function rankCard(icon,title,unit,rows){
  return `<section class="rank box"><div class="rank-h"><span class="tg">${ico(icon)}</span><span class="rank-t">${title}</span><span class="rank-u">${unit}</span></div><ol>${
    rows.map(r=>`<li class="${r.d?"go":"noimg"}"${r.d?` data-open="${r.d.no}"`:""}><span class="pos ${r.pos<=3?"r"+r.pos:""}">${r.pos}</span>${r.d?illust(r.d):""}<span class="rn">${esc(r.name)}<span class="rs">${r.sub}</span></span><span class="rv">${r.v}<small>${r.u||""}</small></span></li>`).join("")
  }</ol></section>`;
}

/* ===== レベルで変わる所を見つける =====
   追加効果の文は「数字・%・小中大」で区切って、Lv1と最大を比べる */
const SEG=/(\d+%|\d+|[小中大])/;
function diffText(a,b){
  const A=(a||"").split(SEG),B=(b||"").split(SEG);
  if(A.length!==B.length)return null;
  const ch=[];A.forEach((x,i)=>{if(x!==B[i])ch.push(i)});
  return {A,B,ch};
}
function markText(t,ch){
  if(!ch||!ch.length)return esc(t);
  return t.split(SEG).map((x,i)=>ch.includes(i)?`<mark>${esc(x)}</mark>`:esc(x)).join("");
}
const segLabel=x=>/%$/.test(x)?"確率 ":/^\d+$/.test(x)?"数 ":"強さ ";
const lvKey=lv=>lv?String(lv):"M";
const lvName=k=>k==="M"?"最大":"Lv"+k;
/* 分かっているレベルを低い順に（最大は最後） */
const lvKeys=L=>Object.keys(L).sort((a,b)=>(a==="M"?99:+a)-(b==="M"?99:+b));
const FIELDS=["持続","マナ","威力","命中"];

/* スキル1つ分のカード */
function skillCard(spName,x){
  const db=(SK[spName]||{})[x.n];
  const cur=lvKey(x.lv);
  const badge=`<span class="lvb${x.lv?"":" max"}">${x.lv?"Lv "+x.lv:"最大"}</span>`;
  if(!db)return `<div class="sk"><div class="sk-h"><b>${esc(x.n)}</b>${badge}</div><p class="nodata">くわしいデータはまだありません</p></div>`;
  const L=db.L,ks=lvKeys(L),k0=ks[0],k1=ks[ks.length-1],now=L[cur];
  const both=ks.length>1,lo=L[k0],hi=L[k1];
  const span=`${lvName(k0)}→${lvName(k1)}`;
  const notes=[];
  const cells=FIELDS.map((f,i)=>{
    const chg=both&&String(lo[i])!==String(hi[i]);
    if(chg)notes.push(`${f} ${lo[i]}→${hi[i]}`);
    let v=now?now[i]:(both&&!chg?lo[i]:null);
    const show=v!=null?esc(v):(both?`${esc(lo[i])}〜${esc(hi[i])}`:esc((lo||hi)[i]));
    return `<div class="st${chg?" chg":""}"><small>${f}</small><b>${show}</b></div>`;
  }).join("")+`<div class="st"><small>属性</small><b>${db.at?elTag(db.at):"？"}</b></div>`;
  let eff=(now||hi||lo)[4],ch=null;
  if(both){const d=diffText(lo[4],hi[4]);if(d){ch=d.ch;d.ch.forEach(i=>notes.push(segLabel(d.A[i])+`${d.A[i]}→${d.B[i]}`))}}
  const known=Object.keys(L).map(lvName).join("・");
  let foot="";
  if(both)foot=notes.length?`<p class="note"><b>${span}</b>${notes.map(esc).join("、")}</p>`:`<p class="note">レベルで変わる所はありません</p>`;
  else foot=`<p class="note">分かっているのは ${known} の値だけです</p>`;
  if(both&&k1!=="M")foot+=`<p class="note">最大の値はまだ確かめていません</p>`;
  if(!now&&both)foot+=`<p class="note">今の${lvName(cur)}の値はまだ確かめていません</p>`;
  return `<div class="sk"><div class="sk-h"><b>${esc(x.n)}</b>${badge}</div><div class="sts">${cells}</div>
    ${eff?`<p class="eff">${markText(eff,ch)}</p>`:`<p class="eff none">追加効果なし</p>`}${foot}</div>`;
}

/* ドラゴンを選ぶ帯（スキル・情報タブ） */
function pickStrip(attr,sel){
  return `<div class="pick">${D.map(d=>`<button data-${attr}="${d.no}" aria-pressed="${sel===d.no}">${illust(d)}<span>${esc(d.nk)}</span></button>`).join("")}</div>`;
}
function viewSkill(){
  const {card}=learnRank("sk","bolt","スキル");
  const d=D.find(x=>x.no===state.skDr)||D[0];
  const missing=D.filter(x=>!SK[x.sp]).map(x=>esc(x.nk)).join("・");
  return `<h2><span class="tg">${ico("bolt")}</span>ドラゴンごとのスキル</h2>
    <p class="hint">色のついた所はレベルで変わります。下の小さな文字が、分かっている一番低いレベルから高いレベルまでの変わり方です</p>
    ${pickStrip("skdr",d.no)}
    <section class="box skp"><div class="skp-h">${illust(d)}<div><b>${esc(d.nk)}</b><small>${esc(d.sp)}</small></div></div>
      ${d.sk.map(x=>skillCard(d.sp,x)).join("")}</section>
    ${missing?`<p class="hint" style="margin-top:10px">まだデータがないドラゴン：${missing}</p>`:""}
    <h2><span class="tg">${ico("crown")}</span>スキルランキング</h2><div class="ranks">${card}</div>`;
}

/* ===== アビリティ ===== */
function viewAbility(){
  const {m,card}=learnRank("ab","shield","アビリティ");
  const names=Object.entries(m).sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0],"ja"));
  const cards=names.map(([n,ds])=>{
    const db=AB[n];
    const holders=ds.map(d=>{const x=d.ab.find(y=>y.n===n);return `<button class="hold" data-open="${d.no}">${esc(d.nk)}<span class="lvb${x.lv?"":" max"}">${x.lv?"Lv"+x.lv:"最大"}</span></button>`}).join("");
    let body=`<p class="nodata">効果はまだ登録されていません</p>`;
    if(db){
      const keys=lvKeys(db.L);
      const k=keys[keys.length-1];
      const lo=keys.length>1?db.L[keys[0]]:null,hi=db.L[k];
      let ch=null,durChg=false,notes=[];
      if(lo&&hi){const d=diffText(lo[1],hi[1]);if(d){ch=d.ch;d.ch.forEach(i=>notes.push(segLabel(d.A[i])+`${d.A[i]}→${d.B[i]}`))}
        durChg=String(lo[0])!==String(hi[0]);if(durChg)notes.unshift(`持続 ${lo[0]}→${hi[0]}`)}
      const v=db.L[k];
      body=`<div class="ab-b"><div class="st${durChg?" chg":""}"><small>持続</small><b>${esc(v[0])}</b></div><p class="eff">${markText(v[1],ch)}<small class="src">${lvName(k)}の効果</small></p></div>
        ${notes.length?`<p class="note"><b>${lvName(keys[0])}→${lvName(k)}</b>${notes.map(esc).join("、")}</p>`:`<p class="note">レベルで変わる所は、ほかのレベルの画面がそろうと分かります</p>`}`;
    }
    return `<section class="box abc"><div class="abc-h"><b>${esc(n)}</b><span class="cnt">${ds.length}体</span></div>${body}<div class="holds">${holders}</div></section>`;
  }).join("");
  return `<h2><span class="tg">${ico("crown")}</span>アビリティランキング</h2><div class="ranks">${card}</div>
    <h2><span class="tg">${ico("shield")}</span>アビリティの効果</h2><p class="hint">覚えているドラゴンを押すと、そのドラゴンのページが開きます</p>
    <div class="abgrid">${cards}</div>`;
}

/* ===== 情報 ===== */
function viewInfo(){
  const d=D.find(x=>x.no===state.inDr)||D[0];
  const p=spOf(d),isV=/変異種$/.test(d.sp);
  const row=(k,v)=>`<div><dt>${k}</dt><dd>${v}</dd></div>`;
  return `<h2><span class="tg">${ico("book")}</span>ドラゴン情報</h2>
    ${pickStrip("indr",d.no)}
    <section class="box info">
      <div class="info-h">${illust(d)}<div><small>No.${d.no}${p.cat?"・"+esc(p.cat):""}</small><b>${esc(d.sp)}</b><span>${esc(d.nk)}</span></div></div>
      ${p.title?`<p class="info-t">${esc(p.title)}</p>`:""}
      <p class="info-d">${esc(p.desc||(isV?VARIANT_DESC:"まだ登録されていません"))}</p>
      <dl class="facts">
        ${row("属性",elTag(p.a))}${row("得意フィールド",fdTag(p.f)||"？")}${row("弱点",elTag(p.w))}
        ${row("伝承地域",esc(p.reg||(isV?"不明":"？")))}${row("出典",esc(p.src||(isV?"不明":"？")))}${row("戦闘体長",esc(p.len||"？"))}
      </dl>
    </section>`;
}

/* ===== 描画・操作 ===== */
const VIEWS={dragon:viewDragon,status:viewStatus,skill:viewSkill,ability:viewAbility,info:viewInfo};
const view=document.getElementById("view");
document.getElementById("n-dragon").innerHTML=`${D.length}<small>体</small>`;
function render(){
  document.querySelectorAll("nav.views button").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===state.tab));
  view.innerHTML=VIEWS[state.tab]();
}
function go(tab,detail=null){
  const same=state.tab===tab&&!detail&&!state.detail;
  state.tab=tab;state.detail=detail;
  try{history.replaceState(null,"","#"+(detail?"d"+detail:tab))}catch(e){}
  render();
  if(!same){const top=document.querySelector("nav.views").offsetTop-4;if(window.scrollY>top)window.scrollTo({top})}
}
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-tab],[data-open],[data-back],[data-dsort],[data-ssort],[data-skdr],[data-indr],[data-img]");
  if(!t)return;const ds=t.dataset;
  if(ds.tab)return go(ds.tab);
  if(ds.open)return go("dragon",+ds.open);
  if("back" in ds)return go("dragon");
  if(ds.img){state.img=ds.img;save();return render()}
  if(ds.dsort)return toggle(state.dSort,ds.dsort,ds.dsort==="no"?1:-1);
  if(ds.ssort)return toggle(state.sSort,ds.ssort,+ds.dd);
  if(ds.skdr){state.skDr=+ds.skdr;save();return render()}
  if(ds.indr){state.inDr=+ds.indr;save();return render()}
});
/* #status #skill #ability #d4 などで直接ひらける */
const h=(location.hash||"").slice(1);
if(VIEWS[h])state.tab=h;else if(/^d\d+$/.test(h)&&D.find(d=>d.no===+h.slice(1))){state.detail=+h.slice(1)}
render();
</script>
</body>
</html>
