<!doctype html>
<!--
  ドラゴン魔石表（GitHub Pages：index.html）
  ・ドラゴンを足す時は script 内の D の配列に1行足すだけ。ランキングや比較は自動で計算されます
  ・画像は images/ の中に No. と同じ2桁の番号で置きます
      images/illust/01.png … イラスト　images/chibi/01.png … デフォルメイラスト
      （選んだ方の画像が無いドラゴンは、もう一方の画像を出します）
  ・デザインは「旅行のしおり集」（t-shimo-1121/shiori）に合わせています
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<title>ドラゴン魔石表</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: しおり集と同じ「紙と札」。1列のカードに大きなアイコンと六角形、数値は六角形の頂点に。iPhone SE（375px）基準 */
:root{
  --paper:hsl(40 30% 94%);
  --sheet:hsl(40 46% 99%);
  --ink:hsl(40 20% 16%);
  --mute:hsl(40 10% 40%);
  --line:hsl(40 22% 84%);
  --accent:hsl(205 45% 34%);
  --soft:hsl(205 45% 93%);
  --tint:hsl(40 34% 90%);
  --dots:hsla(40,25%,45%,.10);
  --radar:hsl(140 55% 40%);
  --hi:hsl(352 70% 46%);--lo:hsl(210 75% 44%);
  --grid:hsl(40 18% 80%);
  --f-head:"BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic",sans-serif;
  /* 文字の大きさは4段階だけ。強調は太字（700）、補足は細字（400）と色で */
  --fs-s:1.06rem;  /* 補足・表の見出し・単位 */
  --fs-m:1.16rem;  /* 本文・表・ボタン */
  --fs-l:1.36rem;  /* 見出し・名前 */
  --fs-xl:1.7rem;  /* ページの題・詳しい画面の名前 */
  /* ランク色（ゲームの配色） */
  --rS:hsl(278 70% 60%);--rA:hsl(44 95% 46%);--rB:hsl(207 78% 56%);--rC:hsl(24 88% 56%);
  --rD:hsl(330 62% 62%);--rE:hsl(187 70% 44%);--rF:hsl(106 46% 50%);--rG:hsl(0 0% 62%);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:hsl(40 12% 11%);--sheet:hsl(40 11% 15%);--ink:hsl(40 18% 93%);--mute:hsl(40 8% 66%);
  --line:hsl(40 10% 27%);--accent:hsl(205 50% 66%);--soft:hsl(205 30% 20%);--tint:hsl(40 12% 19%);
  --dots:hsla(40,20%,70%,.07);--radar:hsl(140 50% 52%);--hi:hsl(352 85% 70%);--lo:hsl(210 85% 70%);--grid:hsl(40 10% 32%);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:hsl(40 12% 11%);--sheet:hsl(40 11% 15%);--ink:hsl(40 18% 93%);--mute:hsl(40 8% 66%);
  --line:hsl(40 10% 27%);--accent:hsl(205 50% 66%);--soft:hsl(205 30% 20%);--tint:hsl(40 12% 19%);
  --dots:hsla(40,20%,70%,.07);--radar:hsl(140 50% 52%);--hi:hsl(352 85% 70%);--lo:hsl(210 85% 70%);--grid:hsl(40 10% 32%);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--dots) 1.1px,transparent 1.1px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:var(--fs-m);line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1em;height:1em;display:inline-block;fill:currentColor;flex:none}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--line)}

/* 見出し */
header{padding-block:16px 4px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--f-head);font-weight:700;font-size:var(--fs-xl);line-height:1.2;margin:0;letter-spacing:.04em}
.tally{display:flex;gap:18px;margin:0}
.tally div{display:flex;flex-direction:column}
.tally dt{font-size:var(--fs-s);color:var(--mute);font-weight:700}
.tally dd{margin:0;font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.2;font-variant-numeric:tabular-nums}
.tally small{font-size:var(--fs-s);font-weight:400;margin-left:2px}

/* タブ（アイコン＋文字の札） */
nav.views{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--paper) 86%,transparent);
  display:flex;gap:2px;padding-block:8px 12px;margin-bottom:6px}
nav.views button{flex:1 1 auto;padding-inline:1px!important;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0 7px;border:1px solid var(--line);border-radius:12px;
  background:var(--sheet);color:var(--mute);font-weight:700;font-size:var(--fs-s);line-height:1.15;min-width:0;letter-spacing:-.11em;white-space:nowrap;overflow:hidden}
nav.views button .ic{font-size:1.4em}
nav.views button[aria-selected="true"]{background:var(--accent);border-color:transparent;color:var(--sheet);box-shadow:0 4px 12px hsla(40,30%,25%,.22)}

h2{font-family:var(--f-head);font-size:var(--fs-l);margin:22px 0 10px;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2:first-child{margin-top:4px}
h2 .tg{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--sheet);font-size:var(--fs-l);flex:none}
h2 .n{font-family:var(--f-body);font-size:var(--fs-m);color:var(--mute);font-weight:400;margin-left:auto}
.hint{color:var(--mute);font-size:var(--fs-m);margin:-4px 0 12px}

/* 並べ替え・絞り込みの札 */
.sorter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sorter button{border:1px solid var(--line);background:var(--sheet);border-radius:11px;padding:5px 12px;font-size:var(--fs-m);font-weight:700;color:var(--ink)}
.sorter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.sorter button small{font-size:var(--fs-s);margin-left:5px;opacity:.7;font-variant-numeric:tabular-nums}
.imgset{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--fs-m);color:var(--mute);font-weight:700;margin:-4px 0 12px}
.imgset .sorter{margin:0;gap:4px;flex-wrap:nowrap}
.imgset .sorter button{font-size:var(--fs-s);padding:3px 6px;white-space:nowrap}

/* イラスト枠 */
.illust{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--tint);display:grid;place-items:center}
.illust img{width:100%;height:100%;object-fit:contain;display:block}
.illust .ph{display:none;text-align:center;color:var(--mute);font-size:var(--fs-s);line-height:1.35;padding:6px}
.illust.empty{border:2px dashed var(--line)}
.illust.empty .ph{display:block}
.illust .ph .ic{font-size:1.8rem;display:block;margin:0 auto 4px}

/* ドラゴン一覧のカード */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.card{display:grid;grid-template-columns:minmax(0,40fr) minmax(0,60fr);gap:6px;align-items:center;width:100%;text-align:left;padding:10px;color:inherit}
.card:active{transform:scale(.99)}
.cl{display:flex;flex-direction:column;gap:3px;min-width:0}
.cl .nk{font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.cl .sp{font-size:var(--fs-s);color:var(--mute);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .fw{gap:4px;flex-wrap:wrap}
.cl .fw-i small{font-size:var(--fs-s)}
.cl .fw .el,.cl .fw .fd{font-size:var(--fs-s);padding:0 5px}
.cl .illust{margin-top:3px;border-radius:10px}
.cl .shape{font-size:var(--fs-s);font-weight:700;color:var(--accent);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sorter.shp button{font-size:var(--fs-m);padding:4px 10px}
.sorter.rksel{margin-bottom:10px}
.sorter.rksel button{font-size:var(--fs-m);padding:4px 11px}
.ranks.one{grid-template-columns:minmax(0,560px)}
/* パラメータ一覧：iPhone SEの幅でも1行に全部 */
.detail .sk:first-of-type{border-top:0}
.detail .d-sec+.sk{border-top:0;padding-top:4px}
.flt{align-items:center;margin-bottom:8px}
.flt-l{font-size:var(--fs-s);color:var(--mute);font-weight:700;margin-right:2px}
.flt button{display:inline-flex;align-items:center;gap:2px;padding:3px 8px}
.flt button .el,.flt button .fd{font-size:var(--fs-m)}
.flt button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cr{min-width:0}
/* カード：上に名前と情報、下にイラストとグラフを同じ高さで横並び */
.card.fold{display:block;padding:0}
.card.fold:active{transform:none}
.card-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"t t" "i r";gap:6px 8px;align-items:stretch;width:100%;padding:10px;border:0;background:none;text-align:left}
.card.fold{position:relative;cursor:pointer}
.card.fold:active .card-h{opacity:.85}
.card-h .tt{grid-area:t;display:flex;align-items:center;gap:6px;min-width:0}
.card-h .nk{flex:1;font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em;min-width:0}
.card-h .nk{display:flex;align-items:baseline}
.card-h .nk.long .nm{letter-spacing:-.08em}
.card-h .nk .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-h .nk .no{flex:none;font-family:var(--f-body);font-size:var(--fs-s);font-weight:400;color:var(--mute);margin-left:4px;letter-spacing:0}
.card-h .shape{flex:none;font-size:var(--fs-s);font-weight:700;color:var(--accent);background:var(--tint);border-radius:99px;padding:1px 8px;white-space:nowrap}
.card .ct{grid-area:t;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .ct-a{display:flex;align-items:baseline;gap:8px;min-width:0}
.card .ct-a .nk{font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.2;white-space:nowrap;letter-spacing:-.02em}
.card .ct-a .sp{font-size:var(--fs-s);color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .ct-b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.card .ct-b .shape{font-size:var(--fs-s);font-weight:700;color:var(--accent);white-space:nowrap}
.card .ct-b .fw{gap:6px}
.card .ct-b .fw .el,.card .ct-b .fw .fd{font-size:var(--fs-s);padding:0 5px}
.card .ci{grid-area:i;min-width:0}
.card .ci .illust{width:100%;border-radius:10px}
.card .cr{grid-area:r;display:flex;align-items:stretch;justify-content:center;min-width:0}
.card .cr .radar{width:100%;height:auto;display:block}
.acc{font-weight:700}
.acc-a{color:#d62839}.acc-b{color:#1f9d55}.acc-c{color:#2b6fd6}.acc-d{color:var(--mute)}
.miss-t{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-m);font-weight:700;margin:-4px 0 12px;cursor:pointer}
.miss-t input{width:1.1rem;height:1.1rem;accent-color:var(--accent);margin:0}
.miss-t small{font-size:var(--fs-s);color:var(--mute);font-variant-numeric:tabular-nums}
.card.miss{grid-template-columns:minmax(0,1fr) auto;opacity:.55;border-style:dashed;box-shadow:none;cursor:default}
.card.miss:active{transform:none}
.card.miss .nk{font-size:var(--fs-l)}
.miss-l{font-size:var(--fs-s);font-weight:700;color:var(--mute);border:1px dashed var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.mu-hd{margin:8px 2px 0;font-weight:700;font-size:var(--fs-m);display:flex;gap:2px}
.mu-hd .el{font:inherit}
.mu-t{gap:2px}
.mu-t .el{font:inherit;line-height:inherit}
.mu-t span:last-child{color:var(--ink)}
.mu-l{margin:2px 2px 4px;font-size:var(--fs-m);line-height:1.6}
.mu-l .none{color:var(--mute);font-size:var(--fs-s)}
.mu-r{display:flex;align-items:baseline;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:var(--fs-m);line-height:1.5}
.mu-r .el{flex:none;font-size:var(--fs-s);padding:0 5px}
.mu-r .none{color:var(--mute);font-size:var(--fs-s)}
.mu-n{margin-left:6px;font-family:var(--f-body);font-size:var(--fs-s);color:var(--mute);font-weight:700}
.mu.cmp{margin-top:8px}
.mu-go{margin:2px 0 6px;border:1px solid var(--line);background:var(--sheet);border-radius:11px;padding:5px 12px;font-size:var(--fs-s);font-weight:700;color:var(--accent)}
.mu-h{display:block;margin:8px 0 2px;font-size:var(--fs-m);color:var(--accent)}
.mu-h small{margin-left:6px;font-size:var(--fs-s);color:var(--mute)}
.card.fold .chev{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--sheet);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.card.fold .chev .ic{width:14px;height:14px}
.card.open .chev{transform:rotate(180deg)}
.card-h{position:relative}
.fold-b{display:none;padding:2px 12px 14px;border-top:1px dashed var(--line)}
.card.open .fold-b{display:block}
.fold-b .fw{margin:10px 0 2px;gap:12px}
.fold-b .fw .el,.fold-b .fw .fd{font-size:var(--fs-m);font-weight:700}
.fold-b .d-sec{margin:14px 0 4px}
.card .sortv{color:var(--accent);font-weight:700}

/* 六角形グラフ */
.radar{display:block;width:100%;height:auto}
.radar .lb{fill:var(--mute);font-family:var(--f-body);font-weight:700}
.radar .vl{fill:var(--ink);font-family:var(--f-head);font-weight:400;stroke:var(--tint);stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
.radar .vl.s{fill:var(--hi)}.radar .vl.lo{fill:var(--lo)}
.radar .si{fill:var(--mute);opacity:.75}
.radar .ti{fill:var(--mute)}
.radar .frame{fill:var(--tint);stroke:var(--grid);stroke-width:1.5}
.radar .gl{fill:none;stroke:var(--grid);stroke-width:1}
.radar .tl,.radar .tv{stroke:var(--sheet);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.radar .tl{fill:var(--mute);font-family:var(--f-body);font-weight:700}
.radar .tv{fill:var(--ink);font-family:var(--f-head);font-weight:700}
.radar .area{fill:var(--radar);fill-opacity:.35;stroke:var(--radar);stroke-width:2.5;stroke-linejoin:round}

/* ランク札（文字） */
.rk{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:6px;font-family:var(--f-head);font-weight:700;font-size:var(--fs-m);line-height:1;color:#fff;flex:none}
.rk.S{background:var(--rS)}.rk.A{background:var(--rA)}.rk.B{background:var(--rB)}.rk.C{background:var(--rC)}
.rk.D{background:var(--rD)}.rk.E{background:var(--rE)}.rk.F{background:var(--rF)}.rk.G{background:var(--rG)}

/* 個別ページ */
.dnav{display:flex;gap:6px;align-items:center;margin:2px 0 10px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:11px;padding:7px 12px;font-weight:700;font-size:var(--fs-m);white-space:nowrap;box-shadow:0 2px 0 var(--line)}
.dnav .sp{flex:1}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.detail{grid-template-columns:1fr}}
.dpanel{padding:14px;min-width:0}
.d-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.d-h h3{margin:0;font-family:var(--f-head);font-weight:700;font-size:var(--fs-xl);line-height:1.2}
.d-h .sp{color:var(--mute);font-weight:700;font-size:var(--fs-m)}
.d-h .tot{margin-left:auto;font-size:var(--fs-m);color:var(--mute);font-weight:700}
.d-h .tot b{font-family:var(--f-head);font-weight:700;font-size:var(--fs-xl);color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.d-art{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch;margin-top:8px}
.d-art .illust{width:100%;border-radius:10px}
.d-art .cr{display:flex;align-items:stretch;justify-content:center;min-width:0}
.d-art .radar{width:100%;height:auto}
.d-sec{font-family:var(--f-head);font-weight:700;font-size:var(--fs-m);margin:16px 0 4px;display:flex;align-items:center;gap:6px;color:var(--accent)}
.d-sec:first-child{margin-top:0}
.kv{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kv li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--tint);border-radius:10px;font-weight:700;font-size:var(--fs-l)}
.kv li.none{color:var(--mute);font-weight:400;background:none;border:1px dashed var(--line)}
.kv .lv{font-size:var(--fs-m);color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ランキング（しおり集と同じ型） */
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin-bottom:6px}
.rank{overflow:hidden}
.rank-h{display:flex;align-items:center;gap:.55rem;padding:.6rem .8rem;background:var(--soft);border-bottom:1px dashed var(--line)}
.rank-h .tg{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--accent);color:var(--sheet);font-size:var(--fs-m);flex:none}
.rank-t{font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.3}
.rank-u{margin-left:auto;font-size:var(--fs-s);color:var(--mute);text-align:right;line-height:1.3}
.rank ol{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:1.9rem 2.6rem minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:.5rem .8rem;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank li.go{cursor:pointer}
.pos{display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;font-family:var(--f-head);font-weight:700;font-size:var(--fs-m);
  background:var(--tint);color:var(--mute);font-variant-numeric:tabular-nums}
.pos.r1{background:hsl(45 80% 52%);color:hsl(40 40% 12%)}.pos.r2{background:hsl(210 10% 72%);color:hsl(210 20% 14%)}.pos.r3{background:hsl(25 55% 55%);color:hsl(25 40% 10%)}
.rank .illust{width:2.6rem;border-radius:8px}
.rank .illust .ph{display:none!important}
.rank li.noimg{grid-template-columns:1.9rem minmax(0,1fr) auto}
.rank li.hasx .rn{white-space:nowrap}
.rank li.nopos{grid-template-columns:2.6rem minmax(0,1fr) auto}
.sl{display:flex;flex-wrap:wrap;gap:0 6px;font-family:var(--f-head);font-weight:700;font-size:var(--fs-m);color:var(--ink);font-variant-numeric:tabular-nums}
.sl b{font-weight:700;margin-right:2px}
.sl i{font-style:normal}.sl i.s{color:var(--hi)}.sl i.lo{color:var(--lo)}
.rank li.rx-li{grid-template-columns:1.9rem 2.6rem minmax(0,1fr) auto 24px;gap:0 8px;padding-top:.4rem;padding-bottom:.4rem}

/* ===== 六角形グラフ：外側にアイコン、内側の角に数値（800以上は赤、400未満は青） ===== */
const ST_ICON=["heart","sword","shield","bolt","target","wing"];
function radar(d,{W=240,R=74,total=true,sq=false,icons=true}={}){
  const IS=17,GAP=5,FV=icons?18:16.2,TV=icons?18:16.2;              // アイコンの大きさ・数値の文字サイズ（画面上で本文の段階に合わせる：数値＝小、合計＝中）・枠とアイコンの間
  const H=Math.round(R*2+(icons?(IS+GAP+2)*2:4));if(sq)W=H;const cx=W/2,cy=H/2;
  const pt=(i,f)=>{const a=(-90+60*i)*Math.PI/180;return[cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
  const poly=f=>[0,1,2,3,4,5].map(i=>pt(i,f).map(n=>n.toFixed(1)).join(",")).join(" ");
  let s=`<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.nk)}の能力：${d.st.map((x,i)=>STATS[i]+x.v).join("、")}、合計${d.total}">`;
  s+=`<polygon class="frame" points="${poly(1)}"/>`;
  [1/3,2/3].forEach(f=>s+=`<polygon class="gl" points="${poly(f)}"/>`);
  for(let i=0;i<6;i++){const[x,y]=pt(i,1);s+=`<line class="gl" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}
  s+=`<polygon class="area" points="${d.st.map((x,i)=>pt(i,Math.max(.04,x.v/999)).map(n=>n.toFixed(1)).join(",")).join(" ")}"/>`;
  d.st.forEach((x,i)=>{
    const[ix,iy]=pt(i,1+(GAP+IS/2)/R);    // 枠の外：アイコン
    if(icons)s+=`<use class="si" href="#i-${ST_ICON[i]}" x="${(ix-IS/2).toFixed(1)}" y="${(iy-IS/2).toFixed(1)}" width="${IS}" height="${IS}"><title>${STATS[i]}</title></use>`;
    const[vx,vy]=pt(i,.76);               // 枠の内側の角：数値
    s+=`<text class="vl${x.v>=800?" s":x.v<400?" lo":""}" x="${vx.toFixed(1)}" y="${(vy+FV*.36).toFixed(1)}" font-size="${FV}" text-anchor="middle">${x.v}</text>`;
  });
  if(total)s+=(icons?`<use class="ti" href="#i-crown" x="${cx-6}" y="${(cy-19).toFixed(1)}" width="12" height="12"/>`:"")+`<text class="tv" x="${cx}" y="${(cy+(icons?12:TV*.36)).toFixed(1)}" font-size="${TV}" text-anchor="middle">${d.total}</text>`;
  return s+"</svg>";
}

/* ===== 並べ替え ===== */
function valOf(d,key){
  if(key==="ms")return msNo(d.sp)||99;
  if(key==="no")return d.no;if(key==="total")return d.total;
  const i=+key.slice(1);
  if(key[0]==="s")return d.st[i].v;
  if(key[0]==="k")return d.sk[i].n;
  if(key[0]==="a")return d.ab[i].n;
}
/* 全体の並び順（No.・合計・各パラメータ）。No.は小さい順、パラメータは大きい順から */
const orderD=(list=D)=>sorted({key:"total",dir:-1},list);  /* ドラゴンはパラメータ（合計）の高い順で固定 */
function sorted(s,list=D){
  return [...list].sort((a,b)=>{const x=valOf(a,s.key),y=valOf(b,s.key);
    const c=typeof x==="string"?x.localeCompare(y,"ja"):x-y;return (c||a.no-b.no)*s.dir});
}
function toggle(s,key,defDir){if(s.key===key)s.dir*=-1;else{s.key=key;s.dir=defDir}save();render()}
const ariaSort=(s,k)=>s.key===k?` aria-sort="${s.dir>0?"ascending":"descending"}"`:"";

/* ===== ランキング：同点は同じ順位、n位までを表示 ===== */
function topN(items,n){
  const arr=[...items].sort((a,b)=>b.v-a.v||(a.tie??0)-(b.tie??0));
  let pos=0,prev=null;
  return arr.map((x,i)=>{if(x.v!==prev){pos=i+1;prev=x.v}return{...x,pos}}).filter(x=>x.pos<=n);
}
const top5=items=>topN(items,5);
function rankCard(icon,title,unit,rows,nopos=false){
  return `<section class="rank box"><div class="rank-h"><span class="tg">${ico(icon)}</span><span class="rank-t">${title}</span><span class="rank-u">${unit}</span></div><ol>${
    rows.map(r=>`<li class="${r.d?"go":"noimg"}${r.x?" hasx":""}${nopos?" nopos":""}${r.more?" rx-li":""}"${r.more?` data-rx="1" role="button" aria-expanded="false"`:r.d?` data-open="${r.d.no}"`:""}>${nopos?"":`<span class="pos ${r.pos<=3?"r"+r.pos:""}">${r.pos}</span>`}${r.d?illust(r.d):""}<span class="rn">${r.nameHtml||esc(r.name)}${r.x||r.more?"":`<span class="rs">${r.sub}</span>`}</span><span class="rv">${r.v}<small>${r.u||""}</small></span>${r.more?`<span class="chev" aria-hidden="true">${ico("chev")}</span>`:""}${r.more?`<div class="rmore">${r.more()}</div>`:""}</li>`).join("")
  }</ol></section>`;
}

/* Maxのデータが無ければ、分かっている一番高いレベルのデータを使う。[値, "Lv3"などの札（Maxなら空）] */
function bestLv(L){
  if(!L)return [null,""];
  if(L.M)return [L.M,""];
  const k=Object.keys(L).filter(k=>k!=="M").sort((a,b)=>b-a)[0];
  return k?[L[k],"Lv"+k]:[null,""];
}

/* ===== 得意な相手・苦手な相手 =====

function atkEls(d){
  const set=new Set();
  d.sk.forEach(x=>{const db=(SK[d.sp]||{})[x.n],[v]=bestLv(db&&db.L);if(db&&db.at&&v&&+v[2]>0)set.add(db.at)});
  return set;
}
const EL_ORDER=["火","水","土","風","光","闇"];
function matchup(d){
  const mine=EL_ORDER.filter(a=>atkEls(d).has(a));
  const head=(ic,a,t)=>`<p class="mu-hd">${elTag(a)}<span>${t}</span></p>`;
  /* 自分の攻撃属性が弱点の相手：種族名を並べる */
  const good=mine.map(a=>{const os=D.filter(o=>o!==d&&spOf(o).w===a);
    return head("sword",a,"が弱点")+`<p class="mu-l">${os.length?os.map(o=>esc(spn(o.sp))).join("・"):`<span class="none">なし</span>`}</p>`}).join("");
  /* 自分の弱点の属性で攻撃してくる相手：種族名・スキル・マナ・命中・威力 */
  const w=spOf(d).w;let bad="";
  if(w){
    const rows=[];
    D.filter(o=>o!==d).forEach(o=>o.sk.forEach(x=>{const db=(SK[o.sp]||{})[x.n],[v,lt]=bestLv(db&&db.L);

/* Maxの値が分かっているスキルを全部集める */
function skillRows(){
  const out=[];
  D.forEach(d=>d.sk.forEach(x=>{
    const db=(SK[d.sp]||{})[x.n];if(!db)return;
    const [v,lt]=bestLv(db.L);if(!v)return;
    const pct=(v[4].match(/(\d+)%の確率/)||[])[1];
    out.push({d,n:x.n,lt,at:db.at,dur:v[0],mana:+v[1]||0,pow:+v[2]||0,acc:v[3],pct:pct?+pct:null,eff:v[4]});
  }));
  /* まだ持っていない種族のスキル（未習得） */
  const have=new Set(D.map(d=>d.sp));
  Object.entries(SK).filter(([sp])=>!have.has(sp)).forEach(([sp,o])=>Object.entries(o).forEach(([n,db])=>{
    const [v,lt]=bestLv(db.L);if(!v)return;
    out.push({d:null,sp,n,lt,at:db.at,dur:v[0],mana:+v[1]||0,pow:+v[2]||0,acc:v[3],pct:null,eff:v[4]});

/* 追加効果での分類。上から順に当てはめる。猛毒→毒、大やけど→火傷、強麻痺→麻痺、裂傷→傷 */
const SK_CATS=["通常","毒","火傷","麻痺","傷","スタン","マナ↑","マナ↓","パラ↑","パラ↓","回復","補助","無敵","その他"];
function skCat(r){
  const e=r.eff||"";
  if(!e)return r.pow>0?"通常":"その他";
  if(/毒状態/.test(e))return "毒";
  if(/やけど状態/.test(e))return "火傷";
  if(/麻痺状態/.test(e))return "麻痺";
  if(/傷状態/.test(e))return "傷";
  if(/スタン/.test(e))return "スタン";
  if(/ダメージを0/.test(e))return "無敵";
  if(/状態異常を無効|付与率/.test(e))return "補助";
  if(/自分のマナ/.test(e))return "マナ↑";
  if(/相手のマナ/.test(e))return "マナ↓";
  if(/自分の(攻撃|防御|素早さ|命中|回避)[をが].*アップ/.test(e))return "パラ↑";
  if(/相手の(攻撃|防御|素早さ|命中|回避)[をが].*ダウン/.test(e))return "パラ↓";
  if(/回復/.test(e))return "回復";
  return "その他";
}

  const echips=`<div class="sorter flt"><span class="flt-l">属性</span><button data-skel="all" aria-pressed="${el==="all"}">すべて<small>${allR.length}</small></button>${els.map(a=>`<button data-skel="${a}" aria-pressed="${el===a}">${elTag(a)}<small>${allR.filter(r=>r.at===a).length}</small></button>`).join("")}</div>`;

  /* 絞り込みは表の列と同じ 属性→マナ→命中→威力→効果 の順に重ねる。選んだ値が無くなった時は「すべて」に戻す */
  const ACC_ORD=["◎","○","△","×","-"];
  const step=(list,label,attr,cur,get,vals,fmt=v=>esc(v))=>{
    const ok=vals.some(v=>String(v)===String(cur));
    const out=ok?list.filter(r=>String(get(r))===String(cur)):list;
    const chips=`<div class="sorter flt"><span class="flt-l">${label}</span><button data-${attr}="all" aria-pressed="${!ok}">すべて<small>${list.length}</small></button>${vals.map(v=>{const n=list.filter(r=>String(get(r))===String(v)).length;return `<button data-${attr}="${esc(v)}" aria-pressed="${ok&&String(v)===String(cur)}">${fmt(v)}<small>${n}</small></button>`}).join("")}</div>`;
    return [out,chips];
  };
  const uniq=(list,get,sort)=>[...new Set(list.map(get))].sort(sort);
  const [byM,mchips]=step(all,"マナ","skmana",state.skMana,r=>r.mana,uniq(all,r=>r.mana,(a,b)=>b-a));
  const [byA,achips]=step(byM,"命中","skacc",state.skAcc,r=>r.acc,uniq(byM,r=>r.acc,(a,b)=>ACC_ORD.indexOf(a)-ACC_ORD.indexOf(b)),v=>v==="-"?"なし":accTag(v));
  const [byP,pchips]=step(byA,"威力","skpow",state.skPow,r=>r.pow,uniq(byA,r=>r.pow,(a,b)=>b-a));
  const [rows,cchips]=step(byP,"効果","skcat",state.skCat,skCat,SK_CATS.filter(k=>byP.some(r=>skCat(r)===k)));
  /* 見出し（属性・マナ・命中・威力）を押すと並べ替え。同じ値の時は威力→マナ→合計の順 */
  const ACC_N={"◎":4,"○":3,"△":2,"×":1,"✕":1,"✖":1};
  const key={at:r=>{const i=EL_ORDER.indexOf(r.at);return i<0?99:i},mana:r=>r.mana,acc:r=>ACC_N[r.acc]||0,pow:r=>r.pow};
  const ss=key[state.skSort.key]?state.skSort:{key:"pow",dir:-1};
  const kf=key[ss.key];
  rows.sort((a,b)=>(kf(a)-kf(b))*ss.dir||b.pow-a.pow||a.mana-b.mana||(b.d?b.d.total:-1)-(a.d?a.d.total:-1));
  const th=(k,n)=>`<th class="c"${ariaSort(ss,k)}><button data-sksort="${k}">${n}</button></th>`;
  const list=rows.length?`<div class="box sklist"><div class="xtbl"><table class="sktbl"><thead><tr><th>スキル・ドラゴン</th>${th("at","属性")}${th("mana","マナ")}${th("acc","命中")}${th("pow","威力")}</tr></thead><tbody>${
    rows.map(r=>{const e=effHTML(r.eff,r.dur);
      const op=r.d?` data-open="${r.d.no}"`:` class="unown"`;
      return `<tr${op}><td class="nm"><b>${esc(skn(r.n))}${r.lt&&r.d?`<span class="lvt">${r.lt}</span>`:""}</b><small class="cnt">${r.d?esc(r.d.nk):`<span class="nw">${esc(spn(r.sp))}</span> <span class="nw">未習得${r.lt?" "+r.lt:""}</span>`}</small></td><td class="c">${r.at?elTag(r.at):"？"}</td><td class="c">${r.mana}</td><td class="c">${accTag(r.acc)}</td><td class="c pw">${r.pow}</td></tr>${e?`<tr class="sk-e${r.d?"":" unown"}"${r.d?` data-open="${r.d.no}"`:""}><td colspan="5" class="ef"><div class="efb">${e}</div></td></tr>`:""}`}).join("")
  }</tbody></table></div></div>`:`<p class="nodata">当てはまるスキルはありません</p>`;
  return echips+mchips+achips+pchips+cchips+list;

}

/* ===== アビリティ =====
   分類：上がるパラメータごと（攻撃・防御・素早さ・命中・回避）と体力・マナ・状態。どれにも入らないものは「その他」
   新しいアビリティは AB_CAT に1行足す。足していない時は効果の文から自動で振り分ける */
const AB_CATS=["攻撃","防御","素早さ","命中","回避","体力","マナ","状態","その他"];
const AB_CAT={"気合の攻め":"攻撃","素早さアップ":"素早さ","アドリブ":"攻撃","見切りの極意":"回避","応急処置":"体力","リセット":"状態","クリティカル":"攻撃","追加攻撃":"攻撃","健康キラー":"攻撃","狙い撃ち":"命中",
  "リカバリー":"体力","ふんばる":"体力","マナアップ":"マナ","緊急チャージ":"マナ","デトックス":"状態","マナセラピー":"状態"};
function abCat(n){
  if(AB_CAT[n])return AB_CAT[n];
  const db=AB[n];const e=db?Object.values(db.L).map(v=>v[1]).join(""):"";
  const m=e.match(/(攻撃|防御|素早さ|命中|回避)が[小中大]アップ/);
  return m?m[1]:"その他";
}
function viewAbility(){
  const {m}=learnRank("ab","shield","アビリティ");
  /* 発動確率の高い順。確率の書いていないもの（フクツ系など、条件を満たせば必ず発動）を最初に。同じ確率なら覚えている数の多い順 */
  const pct=n=>{const v=bestLv((AB[n]||{}).L)[0];if(!v)return -1;const m=String(v[1]).match(/(\d+)%の確率/);return m?+m[1]:100.5};
  const all=[...new Set([...Object.keys(m),...Object.keys(AB)])].map(n=>[n,m[n]||[]]).sort((a,b)=>pct(b[0])-pct(a[0])||b[1].length-a[1].length||a[0].localeCompare(b[0],"ja"));
  const cnt=c=>all.filter(([n])=>abCat(n)===c).length;
  const cats=[["all","すべて",all.length],...AB_CATS.map(c=>[c,c,cnt(c)]).filter(x=>x[2]>0||state.abCat===x[0])];
  const names=state.abCat==="all"?all:all.filter(([n])=>abCat(n)===state.abCat);
  const holders=n=>!m[n]?"":`<div class="holds">${orderD(m[n]).map(d=>`<button class="hold" data-open="${d.no}">${esc(d.nk)}</button>`).join("")}</div>`;
  const table=abilityTable(names.map(([n,ds])=>({n,cnt:ds.length})),holders);
  return `<h2><span class="tg">${ico("shield")}</span>アビリティの効果</h2><p class="hint">発動確率の高い順（条件を満たせば必ず発動するものが先）。効果はMaxの値です（Maxが分からないものは、分かっている一番高いレベルの効果）。覚えているドラゴンを押すと、そのドラゴンのページが開きます</p>
    <div class="sorter">${cats.map(([k,n,c])=>`<button data-abcat="${k}" aria-pressed="${state.abCat===k}">${n}<small>${c}</small></button>`).join("")}</div>
    <div class="box" style="padding:4px 10px">${table}</div>
    ${abExpect()}`;
}
/* ===== 発動回数の目安 =====
   想定する対戦：5ターン。攻撃3回・マナチャージ2回、被弾3回、状態異常3ターン、体力50%以下は2ターン */
const BATTLE={turn:5,atk:3,charge:2,hit:3,ail:3,low:2};
function abChance(t){
  const p=+((String(t).match(/(\d+)%の確率/)||[])[1]||0)/100;
  const B=BATTLE;
  if(/^ターン開始時/.test(t))return {k:"毎ターン",n:B.turn,p};
  if(/^\d+マナ以[上下]の攻撃時/.test(t))return {k:"攻撃",n:B.atk,p,max:true};
  if(/^攻撃時|^攻撃後/.test(t))return {k:"攻撃",n:B.atk,p};
  if(/^攻撃を受ける前|^攻撃を受けた時/.test(t))return {k:"被弾",n:B.hit,p};
  if(/^状態異常の時/.test(t))return {k:"状態異常",n:B.ail,p};
  if(/^マナチャージした時/.test(t))return {k:"チャージ",n:B.charge,p};
  if(/^体力が\d+%以下の時、/.test(t)&&!p)return {k:"体力50%以下",n:B.low,p:1,always:true};
  return null;   // 回避した時・体力0%以下など、今の想定では数えられないもの
}
function abExpect(){
  const rows=[],skip=[];
  Object.keys(AB).forEach(n=>{
    const v=bestLv(AB[n].L)[0];if(!v)return;
    const c=abChance(v[1]);if(!c){skip.push(abn(n));return}
    const e=c.n*c.p, one=c.always?1:1-Math.pow(1-c.p,c.n);
    rows.push({n,c,e,one});
  });
  rows.sort((a,b)=>(b.c.always?1:0)-(a.c.always?1:0)||b.e-a.e||b.one-a.one);  /* 必ず発動するものが先 */
  const pc=x=>Math.round(x*100)+"%";
  const tr=rows.map(r=>`<tr><td class="nm"><b>${esc(abn(r.n))}</b><small class="cnt">${r.c.always?`${r.c.k}の間ずっと`:`${r.c.k} ${Math.round(r.c.p*100)}%×${r.c.n}回${r.c.max?"（最大）":""}`}</small></td><td class="c">${r.c.always?`${r.c.n}<small>ターン</small>`:`${r.e.toFixed(1)}<small>回</small>`}</td><td class="c">${pc(r.one)}</td></tr>`).join("");
  return `<h2><span class="tg">${ico("target")}</span>発動回数の目安</h2>
    <p class="hint">5ターンの対戦で、攻撃3回・マナチャージ2回、攻撃を受ける3回、状態異常3ターン、体力50%以下2ターンとした時の目安です。効果はMaxの値（分からないものは分かっている一番高いレベル）。「1回以上」は1度でも発動する確率</p>
    <div class="box" style="padding:4px 10px"><div class="xtbl"><table class="extbl"><thead><tr><th>アビリティ・きっかけ</th><th class="c">回数</th><th class="c">1回以上</th></tr></thead><tbody>${tr}</tbody></table></div></div>
    ${skip.length?`<p class="hint" style="margin-top:8px">今の想定では数えないもの：${skip.join("・")}</p>`:""}`;
}

if(VIEWS[h])state.tab=h;else if(/^d\d+$/.test(h)&&D.find(d=>d.no===+h.slice(1))){state.detail=+h.slice(1)}
