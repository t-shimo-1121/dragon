<!doctype html>
<!--
  ドラゴン育成ガイド（GitHub Pages：index.html）
  ・ドラゴンを足す時は script 内の D の配列に1行足すだけ。ランキングや比較は自動で計算されます
  ・画像は images/ の中に No. と同じ2桁の番号で置きます
      images/illust/01.png … イラスト　images/chibi/01.png … デフォルメイラスト
      （選んだ方の画像が無いドラゴンは、もう一方の画像を出します）
  ・育成ガイドの種族イラストは images/species/ に種族番号（魔石の順番）の2桁で置き、SP_IMG に種族名を足します
  ・デザインは「旅行のしおり集」（t-shimo-1121/shiori）に合わせています
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1ea">
<title>ドラゴン育成ガイド</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/icon/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="images/icon/icon-192.png">
<link rel="apple-touch-icon" href="images/icon/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="育成ガイド">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* Layout: しおり集と同じ「紙と札」。1列のカードに大きなアイコンと六角形、数値は六角形の頂点に。iPhone SE（375px）基準 */
:root{
  --paper:hsl(40 30% 94%);
  --sheet:hsl(40 46% 99%);
  --ink:hsl(40 20% 16%);
  --mute:hsl(40 10% 40%);
  --line:hsl(40 22% 84%);
  --accent:hsl(205 45% 34%);
  --soft:hsl(205 45% 93%);
  --tint:hsl(40 34% 90%);
  --dots:hsla(40,25%,45%,.10);
  --radar:hsl(140 55% 40%);
  --hi:hsl(352 70% 46%);--lo:hsl(210 75% 44%);
  --grid:hsl(40 18% 80%);
  --f-head:"BIZ UDPGothic",sans-serif;
  --f-body:"BIZ UDPGothic",sans-serif;
  /* 文字の大きさは4段階だけ。強調は太字（700）、補足は細字（400）と色で */
  --fs-s:1.06rem;  /* 補足・表の見出し・単位 */
  --fs-m:1.16rem;  /* 本文・表・ボタン */
  --fs-l:1.36rem;  /* 見出し・名前 */
  --fs-xl:1.7rem;  /* ページの題・詳しい画面の名前 */
  /* ランク色（ゲームの配色） */
  --rS:hsl(278 70% 60%);--rA:hsl(44 95% 46%);--rB:hsl(207 78% 56%);--rC:hsl(24 88% 56%);
  --rD:hsl(330 62% 62%);--rE:hsl(187 70% 44%);--rF:hsl(106 46% 50%);--rG:hsl(0 0% 62%);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:hsl(40 12% 11%);--sheet:hsl(40 11% 15%);--ink:hsl(40 18% 93%);--mute:hsl(40 8% 66%);
  --line:hsl(40 10% 27%);--accent:hsl(205 50% 66%);--soft:hsl(205 30% 20%);--tint:hsl(40 12% 19%);
  --dots:hsla(40,20%,70%,.07);--radar:hsl(140 50% 52%);--hi:hsl(352 85% 70%);--lo:hsl(210 85% 70%);--grid:hsl(40 10% 32%);color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:hsl(40 12% 11%);--sheet:hsl(40 11% 15%);--ink:hsl(40 18% 93%);--mute:hsl(40 8% 66%);
  --line:hsl(40 10% 27%);--accent:hsl(205 50% 66%);--soft:hsl(205 30% 20%);--tint:hsl(40 12% 19%);
  --dots:hsla(40,20%,70%,.07);--radar:hsl(140 50% 52%);--hi:hsl(352 85% 70%);--lo:hsl(210 85% 70%);--grid:hsl(40 10% 32%);color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-color:var(--paper);background-image:radial-gradient(var(--dots) 1.1px,transparent 1.1px);background-size:22px 22px;
  color:var(--ink);font-family:var(--f-body);font-size:var(--fs-m);line-height:1.6;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));
  padding-block:env(safe-area-inset-top,0px) calc(48px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:1080px;margin:0 auto}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:1em;height:1em;display:inline-block;fill:currentColor;flex:none}
.box{background:var(--sheet);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 0 var(--line)}

/* 見出し */
header{padding-block:16px 4px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{font-family:var(--f-head);font-weight:700;font-size:var(--fs-xl);line-height:1.2;margin:0;letter-spacing:.04em}
.tally{display:flex;gap:18px;margin:0}
.tally div{display:flex;flex-direction:column}
.tally dt{font-size:var(--fs-s);color:var(--mute);font-weight:700}
.tally dd{margin:0;font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.2;font-variant-numeric:tabular-nums}
.tally small{font-size:var(--fs-s);font-weight:400;margin-left:2px}

/* タブ（アイコン＋文字の札） */
nav.views{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:linear-gradient(var(--paper) 86%,transparent);
  display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px;padding-block:8px 12px;margin-bottom:6px}
nav.views button{padding-inline:0!important;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:9px 0;border:1px solid var(--line);border-radius:12px;
  background:var(--sheet);color:var(--mute);font-weight:700;font-size:var(--fs-s);line-height:1.15;min-width:0;letter-spacing:-.11em;white-space:nowrap;overflow:hidden}
nav.views button .tl{letter-spacing:0}
nav.views button[aria-selected="true"]{background:var(--accent);border-color:transparent;color:var(--sheet);box-shadow:0 4px 12px hsla(40,30%,25%,.22)}

h2{font-family:var(--f-head);font-size:var(--fs-l);margin:22px 0 10px;display:flex;align-items:center;gap:10px;text-wrap:balance}
h2:first-child{margin-top:4px}
h2 .tg{display:inline-grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--accent);color:var(--sheet);font-size:var(--fs-l);flex:none}
h2 .n{font-family:var(--f-body);font-size:var(--fs-m);color:var(--mute);font-weight:400;margin-left:auto}
.hint{color:var(--mute);font-size:var(--fs-m);margin:-4px 0 12px}

/* 並べ替え・絞り込みの札 */
.abgrp{margin:14px 0 2px;padding-bottom:3px;border-bottom:2px solid var(--accent);color:var(--accent);font-size:var(--fs-m)}.abgrp:first-child{margin-top:8px}.abgrp small{margin-left:6px;opacity:.7}
.sorter{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.sorter button{border:1px solid var(--line);background:var(--sheet);border-radius:11px;padding:5px 12px;font-size:var(--fs-m);font-weight:700;color:var(--ink)}
.sorter button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.sorter button small{font-size:var(--fs-s);margin-left:5px;opacity:.7;font-variant-numeric:tabular-nums}
.imgset{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:var(--fs-m);color:var(--mute);font-weight:700;margin:-4px 0 12px}
.imgset .sorter{margin:0;gap:4px;flex-wrap:nowrap}
.imgset .sorter button{font-size:var(--fs-s);padding:3px 6px;white-space:nowrap}

/* イラスト枠 */
.illust{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;overflow:hidden;background:var(--tint);display:grid;place-items:center}
.illust img{width:100%;height:100%;object-fit:contain;display:block}
.illust .ph{display:none;text-align:center;color:var(--mute);font-size:var(--fs-s);line-height:1.35;padding:6px}
.illust.empty{border:2px dashed var(--line)}
.illust.empty .ph{display:block}
.illust .ph .ic{font-size:1.8rem;display:block;margin:0 auto 4px}

/* ドラゴン一覧のカード */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px}
.card{display:grid;grid-template-columns:minmax(0,40fr) minmax(0,60fr);gap:6px;align-items:center;width:100%;text-align:left;padding:10px;color:inherit}
.card:active{transform:scale(.99)}
.cl{display:flex;flex-direction:column;gap:3px;min-width:0}
.cl .nk{font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}
.cl .sp{font-size:var(--fs-s);color:var(--mute);font-weight:700;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .fw{gap:4px;flex-wrap:wrap}
.cl .fw-i small{font-size:var(--fs-s)}
.cl .fw .el,.cl .fw .fd{font-size:var(--fs-s);padding:0 5px}
.cl .illust{margin-top:3px;border-radius:10px}
.cl .shape{font-size:var(--fs-s);font-weight:700;color:var(--accent);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sorter.shp button{font-size:var(--fs-m);padding:4px 10px}
.sorter.rksel{margin-bottom:10px}
.sorter.rksel button{font-size:var(--fs-m);padding:4px 11px}
.ranks.one{grid-template-columns:minmax(0,560px)}
/* パラメータ一覧：iPhone SEの幅でも1行に全部 */
.detail .sk:first-of-type{border-top:0}
.detail .d-sec+.sk{border-top:0;padding-top:4px}
.flt{align-items:center;margin-bottom:8px}
.flt-l{font-size:var(--fs-s);color:var(--mute);font-weight:700;margin-right:2px}
.flt button{display:inline-flex;align-items:center;gap:2px;padding:3px 8px}
.flt button .el,.flt button .fd{font-size:var(--fs-m)}
.flt button[aria-pressed="true"]{background:var(--soft);border-color:var(--accent);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--accent)}
.cr{min-width:0}
/* カード：上に名前と情報、下にイラストとグラフを同じ高さで横並び */
.card.fold{display:block;padding:0}
.card.fold:active{transform:none}
.card-h{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"t t" "i r";gap:6px 8px;align-items:stretch;width:100%;padding:10px;border:0;background:none;text-align:left}
.card.fold{position:relative;cursor:pointer}
.card.fold:active .card-h{opacity:.85}
.card-h .tt{grid-area:t;display:flex;align-items:center;gap:6px;min-width:0}
.card-h .nk{flex:1;font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em;min-width:0}
.card-h .nk{display:flex;align-items:baseline}
.card-h .nk.long .nm{letter-spacing:-.08em}
.card-h .nk .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.card-h .nk .no{flex:none;font-family:var(--f-body);font-size:var(--fs-s);font-weight:400;color:var(--mute);margin-left:4px;letter-spacing:0}
.card .cr .nospv{display:grid;place-items:center;width:100%;aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;color:var(--mute);font-size:var(--fs-s);text-align:center;line-height:1.4}
.card-h .shape.un{color:var(--mute)}
.g-full{margin:0 2px 6px;font-weight:700;font-size:var(--fs-m)}
.card-h .shape{flex:none;font-size:var(--fs-s);font-weight:700;color:var(--accent);background:var(--tint);border-radius:99px;padding:1px 8px;white-space:nowrap}
.card .ct{grid-area:t;display:flex;flex-direction:column;gap:3px;min-width:0}
.card .ct-a{display:flex;align-items:baseline;gap:8px;min-width:0}
.card .ct-a .nk{font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.2;white-space:nowrap;letter-spacing:-.02em}
.card .ct-a .sp{font-size:var(--fs-s);color:var(--mute);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.card .ct-b{display:flex;align-items:center;flex-wrap:wrap;gap:4px 10px}
.card .ct-b .shape{font-size:var(--fs-s);font-weight:700;color:var(--accent);white-space:nowrap}
.card .ct-b .fw{gap:6px}
.card .ct-b .fw .el,.card .ct-b .fw .fd{font-size:var(--fs-s);padding:0 5px}
.card .ci{grid-area:i;min-width:0}
.card .ci .illust{width:100%;border-radius:10px}
.card .cr{grid-area:r;display:flex;align-items:stretch;justify-content:center;min-width:0}
.card .cr .radar{width:100%;height:auto;display:block}
.acc{font-weight:700}
.acc-a{color:#d62839}.acc-b{color:#1f9d55}.acc-c{color:#2b6fd6}.acc-d{color:var(--mute)}
.miss-t{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-m);font-weight:700;margin:-4px 0 12px;cursor:pointer}
.miss-t input{width:1.1rem;height:1.1rem;accent-color:var(--accent);margin:0}
.miss-t small{font-size:var(--fs-s);color:var(--mute);font-variant-numeric:tabular-nums}
.card.miss{grid-template-columns:minmax(0,1fr) auto;opacity:.55;border-style:dashed;box-shadow:none;cursor:default}
.card.miss:active{transform:none}
.card.miss .nk{font-size:var(--fs-l)}
.miss-l{font-size:var(--fs-s);font-weight:700;color:var(--mute);border:1px dashed var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap}
.mu-hd{margin:8px 2px 0;font-weight:700;font-size:var(--fs-m);display:flex;gap:2px}
.mu-hd .el{font:inherit}
.mu-t{gap:2px}
.mu-t .el{font:inherit;line-height:inherit}
.mu-t span:last-child{color:var(--ink)}
.mu-l{margin:2px 2px 4px;font-size:var(--fs-m);line-height:1.6}
.mu-l .none{color:var(--mute);font-size:var(--fs-s)}
.mu-r{display:flex;align-items:baseline;gap:8px;padding:5px 2px;border-bottom:1px solid var(--line);font-size:var(--fs-m);line-height:1.5}
.mu-r .el{flex:none;font-size:var(--fs-s);padding:0 5px}
.mu-r .none{color:var(--mute);font-size:var(--fs-s)}
.mu-n{margin-left:6px;font-family:var(--f-body);font-size:var(--fs-s);color:var(--mute);font-weight:700}
.mu.cmp{margin-top:8px}
.mu-go{margin:2px 0 6px;border:1px solid var(--line);background:var(--sheet);border-radius:11px;padding:5px 12px;font-size:var(--fs-s);font-weight:700;color:var(--accent)}
.mu-h{display:block;margin:8px 0 2px;font-size:var(--fs-m);color:var(--accent)}
.mu-h small{margin-left:6px;font-size:var(--fs-s);color:var(--mute)}
.card.fold .chev{position:absolute;right:5px;bottom:5px;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--sheet);display:grid;place-items:center;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.card.fold .chev .ic{width:14px;height:14px}
.card.open .chev{transform:rotate(180deg)}
.card-h{position:relative}
.fold-b{display:none;padding:2px 12px 14px;border-top:1px dashed var(--line)}
.card.open .fold-b{display:block}
.fold-b .fw{margin:10px 0 2px;gap:12px}
.fold-b .fw .el,.fold-b .fw .fd{font-size:var(--fs-m);font-weight:700}
.fold-b .d-sec{margin:14px 0 4px}
.card .sortv{color:var(--accent);font-weight:700}

/* 六角形グラフ */
.radar{display:block;width:100%;height:auto}
.radar .lb{fill:var(--mute);font-family:var(--f-body);font-weight:700}
.radar .vl{fill:var(--ink);font-family:var(--f-head);font-weight:400;stroke:var(--tint);stroke-width:3.5px;paint-order:stroke;stroke-linejoin:round}
.radar .vl.s{fill:var(--hi)}.radar .vl.lo{fill:var(--lo)}
.radar .si{fill:var(--mute);opacity:.75}
.radar .ti{fill:var(--mute)}
.radar .frame{fill:var(--tint);stroke:var(--grid);stroke-width:1.5}
.radar .gl{fill:none;stroke:var(--grid);stroke-width:1}
.radar .tl,.radar .tv{stroke:var(--sheet);stroke-width:4px;paint-order:stroke;stroke-linejoin:round}
.radar .tl{fill:var(--mute);font-family:var(--f-body);font-weight:700}
.radar .tv{fill:var(--ink);font-family:var(--f-head);font-weight:700}
.radar .area{fill:var(--radar);fill-opacity:.35;stroke:var(--radar);stroke-width:2.5;stroke-linejoin:round}

/* ランク札（文字） */
.rk{display:inline-grid;place-items:center;width:1.45em;height:1.45em;border-radius:6px;font-family:var(--f-head);font-weight:700;font-size:var(--fs-m);line-height:1;color:#fff;flex:none}
.rk.S{background:var(--rS)}.rk.A{background:var(--rA)}.rk.B{background:var(--rB)}.rk.C{background:var(--rC)}
.rk.D{background:var(--rD)}.rk.E{background:var(--rE)}.rk.F{background:var(--rF)}.rk.G{background:var(--rG)}

/* 個別ページ */
.dnav{display:flex;gap:6px;align-items:center;margin:2px 0 10px}
.btn{border:1px solid var(--line);background:var(--sheet);border-radius:11px;padding:7px 12px;font-weight:700;font-size:var(--fs-m);white-space:nowrap;box-shadow:0 2px 0 var(--line)}
.dnav .sp{flex:1}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:720px){.detail{grid-template-columns:1fr}}
.dpanel{padding:14px;min-width:0}
.d-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px}
.d-h h3{margin:0;font-family:var(--f-head);font-weight:700;font-size:var(--fs-xl);line-height:1.2}
.d-h .sp{color:var(--mute);font-weight:700;font-size:var(--fs-m)}
.d-h .tot{margin-left:auto;font-size:var(--fs-m);color:var(--mute);font-weight:700}
.d-h .tot b{font-family:var(--f-head);font-weight:700;font-size:var(--fs-xl);color:var(--ink);margin-left:4px;font-variant-numeric:tabular-nums}
.d-art{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:stretch;margin-top:8px}
.d-art .illust{width:100%;border-radius:10px}
.d-art .cr{display:flex;align-items:stretch;justify-content:center;min-width:0}
.d-art .radar{width:100%;height:auto}
.d-sec{font-family:var(--f-head);font-weight:700;font-size:var(--fs-m);margin:16px 0 4px;display:flex;align-items:center;gap:6px;color:var(--accent)}
.d-sec:first-child{margin-top:0}
.kv{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.kv li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--tint);border-radius:10px;font-weight:700;font-size:var(--fs-l)}
.kv li.none{color:var(--mute);font-weight:400;background:none;border:1px dashed var(--line)}
.kv .lv{font-size:var(--fs-m);color:var(--accent);border:1px solid currentColor;border-radius:999px;padding:0 8px;white-space:nowrap;font-variant-numeric:tabular-nums}

/* ランキング（しおり集と同じ型） */
.ranks{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:12px;margin-bottom:6px}
.rank{overflow:hidden}
.rank-h{display:flex;align-items:center;gap:.55rem;padding:.6rem .8rem;background:var(--soft);border-bottom:1px dashed var(--line)}
.rank-h .tg{display:inline-grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--accent);color:var(--sheet);font-size:var(--fs-m);flex:none}
.rank-t{font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.3}
.rank-u{margin-left:auto;font-size:var(--fs-s);color:var(--mute);text-align:right;line-height:1.3}
.rank ol{list-style:none;margin:0;padding:0}
.rank li{display:grid;grid-template-columns:1.9rem 2.6rem minmax(0,1fr) auto;gap:0 10px;align-items:center;padding:.5rem .8rem;border-top:1px solid var(--line)}
.rank li:first-child{border-top:0}
.rank li.go{cursor:pointer}
.pos{display:grid;place-items:center;width:1.8rem;height:1.8rem;border-radius:50%;font-family:var(--f-head);font-weight:700;font-size:var(--fs-m);
  background:var(--tint);color:var(--mute);font-variant-numeric:tabular-nums}
.pos.r1{background:hsl(45 80% 52%);color:hsl(40 40% 12%)}.pos.r2{background:hsl(210 10% 72%);color:hsl(210 20% 14%)}.pos.r3{background:hsl(25 55% 55%);color:hsl(25 40% 10%)}
.rank .illust{width:2.6rem;border-radius:8px}
.rank .illust .ph{display:none!important}
.rank li.noimg{grid-template-columns:1.9rem minmax(0,1fr) auto}
.rank li.hasx .rn{white-space:nowrap}
.rank li.nopos{grid-template-columns:2.6rem minmax(0,1fr) auto}
.sl{display:flex;flex-wrap:wrap;gap:0 6px;font-family:var(--f-head);font-weight:700;font-size:var(--fs-m);color:var(--ink);font-variant-numeric:tabular-nums}
.sl b{font-weight:700;margin-right:2px}
.sl i{font-style:normal}.sl i.s{color:var(--hi)}.sl i.lo{color:var(--lo)}
.rank li.rx-li{grid-template-columns:1.9rem 2.6rem minmax(0,1fr) auto 24px;gap:0 8px;padding-top:.4rem;padding-bottom:.4rem}
.rank li.rx-li .rn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rank li.rx-li .chev{width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--sheet);display:grid;place-items:center;transition:transform .2s}
.rank li.rx-li .chev .ic{width:14px;height:14px}
.rank li.rx-li.open .chev{transform:rotate(180deg)}
.pmtbl{table-layout:fixed}
.pmtbl td.c{font-size:var(--fs-m)}
.pmtbl .s{color:var(--hi)}.pmtbl .lo{color:var(--lo)}
.rmore .pmtbl{margin-bottom:4px}
.rmore{display:none;grid-column:1/-1;margin-top:8px;cursor:default}
.rx-li.open .rmore{display:block}
.rx-li .rmore .xtbl{margin:0}
.rx{display:flex;flex-wrap:wrap;align-items:baseline;gap:0 8px;line-height:1.4;font-size:var(--fs-s);color:var(--mute);font-weight:700;white-space:nowrap}
.rx b{font-size:var(--fs-s);color:var(--ink)}
.rx i{font-style:normal;color:var(--ink);font-weight:700;margin:0 5px 0 1px}
.rx i:last-child{margin-right:0}
.rn{font-weight:700;font-size:var(--fs-m);min-width:0;line-height:1.35}
.rs{display:block;font-size:var(--fs-s);color:var(--mute);font-weight:400;line-height:1.4}
.rs .skw{display:block}
.rs .ski{margin-right:6px;white-space:nowrap}
.rs .ski b{color:var(--ink);font-weight:700;margin:0 4px 0 1px}
.rs .ske{display:block;color:var(--ink)}
.rv{text-align:right;font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);font-variant-numeric:tabular-nums;white-space:nowrap}
.rv small{font-family:var(--f-body);font-weight:400;font-size:var(--fs-s);color:var(--mute);margin-left:2px}

/* 一覧表 */
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:var(--fs-m);font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left;vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th{font-size:var(--fs-s);color:var(--mute);font-weight:700;background:var(--sheet)}
th button{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:3px}
th button::after{content:"↕";opacity:.35}
th[aria-sort] button{color:var(--ink)}
th[aria-sort="ascending"] button::after{content:"↑";opacity:1;color:var(--accent)}
th[aria-sort="descending"] button::after{content:"↓";opacity:1;color:var(--accent)}
td.nm,th.nm{position:sticky;left:0;background:var(--sheet);z-index:1;box-shadow:1px 0 0 var(--line)}
td.nm{font-weight:700}
.nmw{display:flex;align-items:center;gap:8px}
.nmw .illust{width:2.2rem;border-radius:7px;flex:none}
.nmw .illust .ph{display:none!important}
tbody tr{cursor:pointer}
td.num{text-align:right}
.cv{display:inline-grid;grid-template-columns:1.45em 3ch;align-items:center;gap:6px;justify-items:end}
.cv .rk{justify-self:start}
.v{display:inline-block;text-align:right;font-variant-numeric:tabular-nums;font-weight:400}
.v.tot{min-width:4ch;font-weight:700}
.best{color:var(--hi);font-weight:700}
.tbl th:not(.nm){text-align:right}
.tbl th button{justify-content:flex-end}
.tbl td,.tbl th{border-left:1px solid var(--line)}
.tbl td.nm,.tbl th.nm{border-left:0}
td.dim{opacity:.3}
tr.hit td{background:var(--soft)}
td .lvn{font-size:var(--fs-s);color:var(--accent);font-weight:700;margin-left:4px}
/* 得意フィールド・弱点の札 */
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:1px;min-width:0}
.sp-row .sp{margin:0;min-width:0}
.fw{display:flex;gap:8px;flex:none}
.d-h+.fw{margin-top:6px}
.fw-i{display:inline-flex;align-items:center;gap:3px}
.fw-i small{font-size:var(--fs-s);color:var(--mute);font-weight:400}
/* 属性・得意フィールドは文字色で見分ける（下地なし） */
.el,.fd{display:inline-block;font-size:var(--fs-s);font-weight:700;line-height:1.5;padding:0!important;background:none;color:var(--mute);white-space:nowrap}
.e-fire{color:hsl(8 75% 46%)}.e-water{color:hsl(208 75% 42%)}.e-earth{color:hsl(28 55% 36%)}
.e-wind{color:hsl(150 55% 32%)}.e-light{color:hsl(42 95% 36%)}.e-dark{color:hsl(275 45% 45%)}
.f-waste{color:hsl(68 50% 32%)}.f-water{color:hsl(195 70% 36%)}.f-forest{color:hsl(130 45% 30%)}.f-rock{color:hsl(35 35% 36%)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .e-fire{color:hsl(8 85% 66%)}:root:not([data-theme="light"]) .e-water{color:hsl(208 85% 68%)}:root:not([data-theme="light"]) .e-earth{color:hsl(30 60% 62%)}
:root:not([data-theme="light"]) .e-wind{color:hsl(150 55% 58%)}:root:not([data-theme="light"]) .e-light{color:hsl(46 95% 60%)}:root:not([data-theme="light"]) .e-dark{color:hsl(275 60% 74%)}
:root:not([data-theme="light"]) .f-waste{color:hsl(68 55% 58%)}:root:not([data-theme="light"]) .f-water{color:hsl(195 70% 62%)}:root:not([data-theme="light"]) .f-forest{color:hsl(130 45% 58%)}:root:not([data-theme="light"]) .f-rock{color:hsl(35 40% 62%)}}
:root[data-theme="dark"] .e-fire{color:hsl(8 85% 66%)}:root[data-theme="dark"] .e-water{color:hsl(208 85% 68%)}:root[data-theme="dark"] .e-earth{color:hsl(30 60% 62%)}
:root[data-theme="dark"] .e-wind{color:hsl(150 55% 58%)}:root[data-theme="dark"] .e-light{color:hsl(46 95% 60%)}:root[data-theme="dark"] .e-dark{color:hsl(275 60% 74%)}
:root[data-theme="dark"] .f-waste{color:hsl(68 55% 58%)}:root[data-theme="dark"] .f-water{color:hsl(195 70% 62%)}:root[data-theme="dark"] .f-forest{color:hsl(130 45% 58%)}:root[data-theme="dark"] .f-rock{color:hsl(35 40% 62%)}
[aria-pressed="true"] .el,[aria-pressed="true"] .fd{color:inherit}
/* ドラゴンを選ぶ帯 */
.pick{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px 8px;scrollbar-width:thin}
.pick button{flex:none;min-width:4.6rem;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;border:1px solid var(--line);border-radius:12px;background:var(--sheet);font-size:var(--fs-s);font-weight:700;line-height:1.2}
.pick button span{white-space:nowrap}
.pick .illust{width:3rem;border-radius:8px}
.pick .illust .ph{display:none!important}
.pick button[aria-pressed="true"]{border-color:var(--accent);background:var(--soft);box-shadow:inset 0 0 0 2px var(--accent)}
/* スキル */
.sk{border-top:1px dashed var(--line);padding:10px 0 8px}
.sk-h{display:flex;align-items:center;justify-content:space-between;gap:8px}
.sk-h b{font-size:var(--fs-l)}
.sts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;margin-top:6px}
.st{background:var(--tint);border-radius:9px;padding:4px 2px 5px;text-align:center;min-width:0}
.st small{display:block;font-size:var(--fs-s);color:var(--mute);font-weight:700;line-height:1.3}
.st b{display:block;font-family:var(--f-head);font-weight:700;font-size:var(--fs-l);line-height:1.3;font-variant-numeric:tabular-nums;white-space:nowrap}
.st b .el{font-size:var(--fs-s);padding:0 5px}
.st.chg{background:hsl(45 95% 62% / .45);box-shadow:inset 0 0 0 1.5px hsl(40 85% 45% / .6)}
mark{background:hsl(45 95% 62% / .55);color:inherit;border-radius:3px;padding:0 2px;font-weight:700}
.eff{margin:7px 0 0;font-size:var(--fs-m);line-height:1.55}
.eff.none{color:var(--mute);font-size:var(--fs-m)}
.eff .src{display:block;font-size:var(--fs-s);color:var(--mute)}
.note{margin:4px 0 0;font-size:var(--fs-s);color:var(--mute);line-height:1.5}
.note b{color:var(--ink);margin-right:6px}
.nodata{margin:6px 0 0;font-size:var(--fs-m);color:var(--mute);border:1px dashed var(--line);border-radius:9px;padding:6px 10px}
/* アビリティ */
.xtbl{margin:0 -4px}
.xtbl table{table-layout:auto;font-size:var(--fs-m);line-height:1.4}
.xtbl th,.xtbl td{white-space:normal;padding:6px 4px;vertical-align:middle;border-left:0}
.xtbl th{font-size:var(--fs-s);font-weight:400;padding-top:3px;padding-bottom:3px;white-space:nowrap}
.xtbl .c{text-align:center;white-space:nowrap;width:1.9rem;padding-left:1px;padding-right:1px}
.xtbl td.c{font-family:var(--f-head);font-weight:700;font-size:var(--fs-m)}
.xtbl td.c .el{font-size:var(--fs-m);font-weight:700;font-family:var(--f-body)}
.xtbl td.c .acc{font-size:var(--fs-m)}
.xtbl td.nm{font-weight:700;white-space:nowrap}
.xtbl td.nm b{display:block;font-weight:700}
.xtbl td.nm .cnt{display:block;color:var(--mute);font-size:var(--fs-s);font-weight:400}
.xtbl td.ef{font-size:var(--fs-m);line-height:1.45}
/* スキルの表：効果は下の行に横いっぱいで */
.sktbl .c{width:3.4rem}
.sklist{padding:4px 10px}
.sktbl tr.unown{cursor:default}
.extbl .c{width:4.4rem}
.cd-g{margin:16px 2px 6px;font-size:var(--fs-m);color:var(--accent)}
.cdtbl tbody tr{cursor:default}
.cdtbl td.nm{white-space:normal}
.cdtbl td.ef{text-align:right;font-weight:700;white-space:nowrap;width:1%}
.extbl td.c small{font-size:var(--fs-s);font-weight:400;color:var(--mute);margin-left:2px}
.extbl tbody tr{cursor:default}
.sktbl td.nm .cnt{white-space:normal}
.sktbl .nw{white-space:nowrap}
.sktbl th.c button{justify-content:center;width:100%}
.sktbl tr:has(+tr.sk-e) td{border-bottom:0;padding-bottom:0}
.sktbl tr.sk-e td{padding:4px 0 10px}
.sktbl .efb{background:var(--tint);border-radius:8px;padding:5px 10px;line-height:1.5}
/* ドラゴン別スキル：通常種＋変異種で1枚。スキルごとに 上＝通常・下＝変異、効果は下にまとめて */
.spgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.spc{padding:8px 10px 6px}
.spc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:0 2px 4px;border-bottom:1px solid var(--line)}
.spc-h b{font-size:var(--fs-l)}
.spc-h small{font-size:var(--fs-s);color:var(--mute);font-weight:400;text-align:right}
.spc .xtbl{margin:0 -2px}
.xtbl table.sptbl{table-layout:fixed;width:100%}
.sptbl th.c,.sptbl td.c{width:auto}
.sptbl th.kd,.sptbl td.kd{width:4.8rem;padding-left:2px;padding-right:2px;white-space:nowrap}
.sptbl td.kd{font-size:var(--fs-s);font-weight:700;color:var(--mute)}
.sptbl tr.sn td{padding:9px 2px 2px;border-bottom:0;font-weight:700}
.sptbl tr.sn:first-child td{padding-top:4px}
.sptbl tr.sn .lvt{margin-left:4px}
.sptbl tr.rw td{border-bottom:0;padding-top:3px;padding-bottom:3px}
.sptbl tr.rw.rv td{border-top:1px dotted var(--line)}
.sptbl td.df{background:var(--soft);border-radius:6px}
.sptbl tr.ex td{padding:3px 0 6px;border-bottom:1px solid var(--line)}
.sptbl tr.ex:last-child td{border-bottom:0}
.sptbl .efb{background:var(--tint);border-radius:8px;padding:4px 9px;line-height:1.5;font-size:var(--fs-m)}
.sptbl .efb div{display:flex;gap:6px}
.sptbl .efb i{font-style:normal;font-size:var(--fs-s);color:var(--mute);font-weight:700;flex:none;width:2.2em}
.sptbl .nod{color:var(--mute);font-size:var(--fs-s);font-weight:400}
.go-down{display:inline-block;margin:0 0 10px;font-size:var(--fs-s);color:var(--accent);font-weight:700;background:none;border:0;padding:0}
/* アビリティタブ：名前の下に効果と覚えているドラゴンを横いっぱいで */
.abtbl.stack td{display:block}
.abtbl.stack td.nm{border-bottom:0;padding-bottom:0;position:static;box-shadow:none}
.abtbl.stack td.nm b,.abtbl.stack td.nm .cnt{display:inline;margin-right:8px}
.xtbl td.sp{white-space:nowrap;font-size:var(--fs-m)}
.xtbl .dur{margin-left:2px;font-size:var(--fs-s);color:var(--mute);white-space:nowrap}
.xtbl .none{color:var(--mute);font-size:var(--fs-s);font-weight:400}
.up{color:var(--hi);font-weight:700}.dn{color:var(--lo);font-weight:700}
.lvt{margin-left:6px;font-size:var(--fs-s);font-weight:400;color:var(--mute)}
.xtbl .tnote{margin:4px 4px 8px;font-size:var(--fs-s);color:var(--mute)}
.abtbl td.nm{width:1%}
.abgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:10px}
.abc{padding:10px 12px}
.abc-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.abc-h b{font-size:var(--fs-l)}
.abc-h .cnt{font-size:var(--fs-s);color:var(--mute);font-weight:700}
.ab-b{display:grid;grid-template-columns:3.6rem minmax(0,1fr);gap:8px;align-items:start;margin-top:6px}
.ab-b .eff{margin:0}
/* 検証の見た目（バトルタブでも使う） */
.lab-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tag{display:inline-block;font-size:var(--fs-s);font-weight:700;border:1.5px solid currentColor;border-radius:7px;padding:0 6px;line-height:1.5;white-space:nowrap}
.tag.ok{color:var(--accent)}.tag.hyp{color:var(--mute)}
.lab-b{padding:10px 14px}
.lab-b p{margin:0 0 8px}
.lab-b ul{margin:0 0 8px;padding-left:1.2em}
.lab-b li{margin:2px 0}
.lab-b li::marker{color:var(--mute)}
.lab-b .xtbl{margin:4px -4px 8px}
.lab-b .xtbl td.c{width:auto}
.lab-b .note:last-child,.lab-b p:last-child,.lab-b ul:last-child{margin-bottom:0}
.lab-t th.c,.lab-t td.c{text-align:right;padding-right:6px}
.lab-t td.nm{white-space:nowrap;font-weight:700}
.lab-t th:first-child{white-space:nowrap}
.lab-t th{white-space:normal;vertical-align:bottom;line-height:1.3}
.lab-t th .cnt{display:block;font-size:var(--fs-s);color:var(--mute)}
.lab-t td.nm .cnt{display:block}
.lab-t td.c{font-family:var(--f-body);font-weight:400;white-space:nowrap}
.lab-t .ar{color:var(--mute);font-weight:400;margin:0 2px}
.lab-cond{margin:-4px 0 12px;font-size:var(--fs-s);color:var(--mute)}
.dmg-f{font-weight:700;border:1px solid var(--line);border-radius:9px;padding:8px 10px;background:var(--sheet)}
/* 育成タブ */
.sim-b{padding:10px 12px}
.sim-b .sorter{margin:0 0 10px}
.lab-t .spv-t{padding-left:10px}
.bk-rr{margin:4px 0 4px}
.bk-rr .cnt{margin-left:3px}
/* 型のボタンは4列にそろえて段数を抑える */
.bk-ty{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;margin:0 0 6px}
.bk-ty button{padding-left:2px;padding-right:2px;justify-content:center;white-space:nowrap;letter-spacing:-.03em;font-size:var(--fs-s)}
.bk-ty .cnt{margin-left:2px}
.bk-ty button:disabled{opacity:.4}
.bk-h{display:flex;align-items:center;gap:8px;margin:16px 0 6px;font-size:var(--fs-m)}
.bk-h .n{font-weight:400;font-size:var(--fs-s);color:var(--mute)}
.rr{display:inline-block;min-width:2.2em;text-align:center;border-radius:6px;padding:1px 5px;font-weight:700;font-size:var(--fs-s);border:1px solid var(--line);background:var(--sheet)}
.rr-SR{border-color:var(--accent);color:var(--accent)}
.rr-UR{background:var(--accent);border-color:var(--accent);color:var(--sheet)}
.bk-g{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:760px){.bk-g{grid-template-columns:1fr 1fr}}
.bk-c{background:var(--sheet);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
/* 上に1行（レアリティ・種族名・合計）、その下を2×2：左上＝六角形＋数値、残り3マス＝技 */
.bk-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"n n" "rd s1" "s2 s3";grid-template-rows:auto auto auto;gap:6px 10px;align-items:start}
.bk-rd{grid-area:rd;align-self:center}
.bk-st{display:flex;align-items:center;justify-content:flex-start;gap:10px}
.bk-st .radar.hm{width:auto;flex:none}
.bk-st .radar.hm .area{stroke-width:2}
.bk-sv{display:grid;grid-template-columns:auto auto;gap:4px 10px;font-size:var(--fs-s);line-height:1.3}
.bk-sv span{display:flex;gap:3px;align-items:baseline}
.bk-sv i{font-style:normal;color:var(--mute);font-size:.88em}
.bk-sv b{font-weight:400}
.bk-sv b.s{color:var(--hi);font-weight:700}.bk-sv b.lo{color:var(--lo);font-weight:700}
.bk-tot{margin-left:5px;white-space:nowrap;font-weight:700;font-size:var(--fs-s)}
.bk-ok{margin-left:5px;color:var(--hi);font-size:var(--fs-s)}
.bk-tot i{font-style:normal;font-weight:400;color:var(--mute);margin-right:2px}
.bk-s{border-left:3px solid var(--line);padding-left:7px;line-height:1.35}
.bk-nv{margin-left:8px;font-weight:400;font-size:var(--fs-s);color:var(--mute)}
.bk-c.nov .bk-body{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"n n" "s1 s2" "s3 .";grid-template-rows:auto}
.bk-s1{grid-area:s1}.bk-s2{grid-area:s2}.bk-s3{grid-area:s3}
.bk-sn{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.bk-sn b.nmx{color:var(--lo)}  /* レベルMaxでないスキル名は青 */
.bk-sm{font-size:var(--fs-s);color:var(--mute);letter-spacing:-.04em}
.bk-se{font-size:var(--fs-s)}
.bk-none{font-size:var(--fs-s);color:var(--mute);margin:0}
.bk-n{grid-area:n;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.bk-n .rr{margin-right:4px;min-width:0;padding:1px 4px}
.spv-src{margin:8px 0 0;padding-left:1.1em;font-size:var(--fs-s);color:var(--mute);line-height:1.6}
/* 育て方 */
.way{padding:8px 0;border-bottom:1px solid var(--line)}
.way:first-child{padding-top:0}
.way:last-child{border-bottom:0;padding-bottom:0}
.way b{font-size:var(--fs-l)}
.way p{margin:2px 0 0}
.way-l{margin:2px 0 0;padding-left:1.2em}
.way .xtbl{margin:4px -4px 0}
.way .lab-t td.nm,.way .lab-t th{white-space:normal}
/* 大会カレンダー */
.cup-wk{display:grid;grid-template-columns:2.6rem minmax(0,1fr);gap:8px;padding:8px 0;border-bottom:1px solid var(--line);align-items:start}
.cup-wk:last-child{border-bottom:0}

const KEEP=["bkRr","bkTy","dSort","sSort","img","abCat","gTy","rk","skMana","skCat","skPow","skAcc","skEl","dMiss"];
try{const s=JSON.parse(localStorage.getItem("dragon-maseki-v2")||"{}");KEEP.forEach(k=>{if(s[k])state[k]=s[k]})}catch(e){}
state.img="illust";  // 画像はイラストに固定
const save=()=>{try{localStorage.setItem("dragon-maseki-v2",JSON.stringify(Object.fromEntries(KEEP.map(k=>[k,state[k]]))))}catch(e){}};

/* ===== イラスト枠（画像が無ければ仮置きの枠） ===== */
function imgPath(d){const[,dir,ext]=IMG_SETS[state.img];return dir+String(d.no).padStart(2,"0")+ext}
function illust(d){
  const src=imgPath(d);

/* ===== 六角形グラフ：外側にアイコン、内側の角に数値（800以上は赤、400未満は青） ===== */
const ST_ICON=["heart","sword","shield","bolt","target","wing"];
function radar(d,{W=240,R=74,total=true,sq=false,icons=true,max=999,hi=800,lo=400,fs=0}={}){
  const IS=17,GAP=5,FV=fs||(icons?18:16.2),TV=fs||(icons?18:16.2);              // アイコンの大きさ・数値の文字サイズ（画面上で本文の段階に合わせる：数値＝小、合計＝中）・枠とアイコンの間
  const H=Math.round(R*2+(icons?(IS+GAP+2)*2:4));if(sq)W=H;const cx=W/2,cy=H/2;
  const pt=(i,f)=>{const a=(-90+60*i)*Math.PI/180;return[cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
  const poly=f=>[0,1,2,3,4,5].map(i=>pt(i,f).map(n=>n.toFixed(1)).join(",")).join(" ");
  let s=`<svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.nk)}の能力：${d.st.map((x,i)=>STATS_L[i]+x.v).join("、")}、合計${d.total}">`;
  s+=`<polygon class="frame" points="${poly(1)}"/>`;
  [1/3,2/3].forEach(f=>s+=`<polygon class="gl" points="${poly(f)}"/>`);
  for(let i=0;i<6;i++){const[x,y]=pt(i,1);s+=`<line class="gl" x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}"/>`}
  s+=`<polygon class="area" points="${d.st.map((x,i)=>pt(i,Math.max(.04,x.v/max)).map(n=>n.toFixed(1)).join(",")).join(" ")}"/>`;
  d.st.forEach((x,i)=>{
    const[ix,iy]=pt(i,1+(GAP+IS/2)/R);    // 枠の外：アイコン
    if(icons)s+=`<use class="si" href="#i-${ST_ICON[i]}" x="${(ix-IS/2).toFixed(1)}" y="${(iy-IS/2).toFixed(1)}" width="${IS}" height="${IS}"><title>${STATS_L[i]}</title></use>`;
    const[vx,vy]=pt(i,.76);               // 枠の内側の角：数値
    s+=`<text class="vl${x.v>=hi?" s":x.v<lo?" lo":""}" x="${vx.toFixed(1)}" y="${(vy+FV*.36).toFixed(1)}" font-size="${FV}" text-anchor="middle">${x.v}</text>`;
  });
  if(total)s+=(icons?`<use class="ti" href="#i-crown" x="${cx-6}" y="${(cy-19).toFixed(1)}" width="12" height="12"/>`:"")+`<text class="tv" x="${cx}" y="${(cy+(icons?12:TV*.36)).toFixed(1)}" font-size="${TV}" text-anchor="middle">${d.total}</text>`;
  return s+"</svg>";
}

/* ===== 魔導書のカード用：小さい六角形（形だけ）＋数値の小表（29以上は赤、12未満は青） ===== */
function hexMini(v,{R=31,pad=3,max=36}={}){
  const W=+(R*2*.866+pad*2).toFixed(1),H=R*2+pad*2,cx=W/2,cy=H/2;
  const pt=(i,f)=>{const a=(-90+60*i)*Math.PI/180;return[cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
  const poly=f=>[0,1,2,3,4,5].map(i=>pt(i,f).map(n=>n.toFixed(1)).join(",")).join(" ");
  return `<svg class="radar hm" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" aria-hidden="true"><polygon class="frame" points="${poly(1)}"/><polygon class="gl" points="${poly(.5)}"/><polygon class="area" points="${v.map((x,i)=>pt(i,Math.max(.06,x/max)).map(n=>n.toFixed(1)).join(",")).join(" ")}"/></svg>`;
}
function bkStat(r){
  const cl=x=>x>=29?" s":x<12?" lo":"";
  return `<div class="bk-st">${hexMini(r.v,{R:34})}<div class="bk-sv" role="img" aria-label="${esc(r.sp)}の種族値：${r.v.map((x,i)=>STATS_L[i]+x).join("、")}、合計${spvTot(r)}">${r.v.map((x,i)=>`<span><i>${STATS[i]}</i><b class="${cl(x).trim()}">${x}</b></span>`).join("")}</div></div>`;
}

/* ===== 並べ替え ===== */
function valOf(d,key){
  if(key==="ms")return msNo(d.sp)||99;
  if(key==="no")return d.no;if(key==="total")return d.total;
  const i=+key.slice(1);
  if(key[0]==="s")return d.st[i].v;
  if(key[0]==="k")return d.sk[i].n;
  if(key[0]==="a")return d.ab[i].n;
}
/* 全体の並び順（No.・合計・各パラメータ）。No.は小さい順、パラメータは大きい順から */
const orderD=(list=D)=>sorted({key:"total",dir:-1},list);  /* ドラゴンはパラメータ（合計）の高い順で固定 */
function sorted(s,list=D){
  return [...list].sort((a,b)=>{const x=valOf(a,s.key),y=valOf(b,s.key);
    const c=typeof x==="string"?x.localeCompare(y,"ja"):x-y;return (c||a.no-b.no)*s.dir});
}
function toggle(s,key,defDir){if(s.key===key)s.dir*=-1;else{s.key=key;s.dir=defDir}save();render()}
const ariaSort=(s,k)=>s.key===k?` aria-sort="${s.dir>0?"ascending":"descending"}"`:"";

/* ===== ランキング：同点は同じ順位、n位までを表示 ===== */
function topN(items,n){
  const arr=[...items].sort((a,b)=>b.v-a.v||(a.tie??0)-(b.tie??0));
  let pos=0,prev=null;
  return arr.map((x,i)=>{if(x.v!==prev){pos=i+1;prev=x.v}return{...x,pos}}).filter(x=>x.pos<=n);
}
const top5=items=>topN(items,5);
function rankCard(icon,title,unit,rows,nopos=false){
  return `<section class="rank box"><div class="rank-h"><span class="tg">${ico(icon)}</span><span class="rank-t">${title}</span><span class="rank-u">${unit}</span></div><ol>${
    rows.map(r=>`<li class="${r.d?"go":"noimg"}${r.x?" hasx":""}${nopos?" nopos":""}${r.more?" rx-li":""}"${r.more?` data-rx="1" role="button" aria-expanded="false"`:r.d?` data-open="${r.d.no}"`:""}>${nopos?"":`<span class="pos ${r.pos<=3?"r"+r.pos:""}">${r.pos}</span>`}${r.d?illust(r.d):""}<span class="rn">${r.nameHtml||esc(r.name)}${r.x||r.more?"":`<span class="rs">${r.sub}</span>`}</span><span class="rv">${r.v}<small>${r.u||""}</small></span>${r.more?`<span class="chev" aria-hidden="true">${ico("chev")}</span>`:""}${r.more?`<div class="rmore">${r.more()}</div>`:""}</li>`).join("")
  }</ol></section>`;
}

/* ランキングの小分類：札を押すと、そのランキングだけを出す
   opts は [id, 札の名前, カードを作る関数]。カードを作る関数が null を返す札は出さない */
function rankSel(tab,opts){
  const ok=opts.map(([k,n,f])=>[k,n,f()]).filter(x=>x[2]);

}

/* ===== 育成ガイド（種族ごと） =====
   種族名・イラスト・種族値（魔導書の六角形）・スキルの最大効果・相性。
   型は魔導書の種族値（spvType）から決める */
const nsp=s=>String(s||"").replace(/・/g,"");
const byN=o=>Object.fromEntries(Object.keys(o).map(k=>[nsp(k),k]));
let GS=null;
function guideList(){
  if(GS)return GS;
  const skK=byN(SK),spK=byN(SP),spv=Object.fromEntries(SPV.map(r=>[nsp(r.sp),r]));
  GS=MASEKI.map(sp=>{const k=nsp(sp);
    return {sp,no:msNo(sp),rr:rarOf(sp),skKey:skK[k],spKey:spK[k],spv:spv[k],d:D.find(d=>nsp(d.sp)===k)}})
    .filter(g=>g.skKey||g.spv);
  GS.forEach(g=>{g.ty=g.spv?spvType(g.spv):"未調査";g.p=SP[g.spKey]||{}});
  return GS;
}
/* 種族のイラスト：images/species/ に種族番号（魔石の順番）の2桁で置いた画像を優先。
   無ければその種族の魔石（相棒）の画像、それも無ければ準備中の枠。
   画像を置いたら SP_IMG に種族名を足す */
const SP_IMG=["リントヴルム変異種","蜃変異種"];
const gIllust=g=>SP_IMG.some(s=>nsp(s)===nsp(g.sp))?`<div class="illust ${state.img}"><img src="images/species/${String(g.no).padStart(2,"0")}.png" alt="" loading="lazy"></div>`:g.d?illust(g.d):`<div class="illust ${state.img} empty"><span class="ph">${ico("img")}イラスト準備中</span></div>`;
const gRadar=g=>g.spv?radar({nk:g.sp,st:g.spv.v.map(v=>({v})),total:spvTot(g.spv)},{sq:true,icons:false,max:36,hi:29,lo:12}):`<div class="nospv">種族値は<br>まだ調べていません</div>`;
/* スキル：データのあるスキルを全部、Max（無ければ分かっている一番高いLv）で */
const gSkills=g=>g.skKey?skillTable(g.skKey,Object.keys(SK[g.skKey]).map(n=>({n}))):`<p class="nodata">スキルはまだ調べていません</p>`;
function viewDragon(){
  const L=guideList();
  const tys=[...new Set(L.map(g=>g.ty))].sort((a,b)=>tyOrd(a)-tyOrd(b));
  if(state.gTy!=="all"&&!tys.includes(state.gTy))state.gTy="all";
  const chips=`<div class="sorter shp"><button data-gty="all" aria-pressed="${state.gTy==="all"}">すべて<small>${L.length}</small></button>${tys.map(t=>`<button data-gty="${esc(t)}" aria-pressed="${state.gTy===t}">${esc(t)}<small>${L.filter(g=>g.ty===t).length}</small></button>`).join("")}</div>`;
  const cards=L.filter(g=>state.gTy==="all"||g.ty===state.gTy).map(g=>{const id="g"+g.no,op=state.dOpen.includes(id),nm=spn(g.sp);return `
    <div class="card box fold${op?" open":""}" data-acc="${id}" role="button" tabindex="0" aria-expanded="${op}" aria-label="${esc(g.sp)}のくわしい情報">
      <div class="card-h">
        <div class="tt"><b class="nk${[...nm].length>=7?" long":""}"><span class="nm">${esc(nm)}</span><small class="no">No.${g.no}・${g.rr}</small></b><span class="shape${g.spv?"":" un"}">${esc(g.ty)}</span></div>
        <div class="ci">${gIllust(g)}</div><div class="cr">${gRadar(g)}</div>
        <span class="chev" aria-hidden="true">${ico("chev")}</span></div>
      <div class="fold-b">${nm!==g.sp?`<p class="g-full">${esc(g.sp)}</p>`:""}${fieldRow({sp:g.spKey||""},true)}
        <h4 class="d-sec">${ico("bolt")}スキル</h4>${gSkills(g)}
        <h4 class="d-sec">${ico("target")}相性</h4>${matchup(g)}</div>
    </div>`}).join("");
  return `<p class="hint">種族ごとの育て方の目安です。六角形は魔導書の種族値（1年4月1週・調子普通で、アイテムなしの特訓で主に上がる量）。29以上を赤、12未満を青にしています。型は種族値から決めています</p>${chips}<div class="grid">${cards}</div>`;
}
/* ===== 魔石（これまで育てた相棒の記録） ===== */
function viewMaseki(){
  if(state.detail)return viewDetail(D.find(d=>d.no===state.detail));
  const list=orderD();
  const have=new Set(D.map(d=>d.sp));
  const miss=state.dMiss?MASEKI.map((sp,i)=>({sp,n:i+1})).filter(x=>!have.has(x.sp)):[];
  const missN=MASEKI.filter(sp=>!have.has(sp)).length;
  const missBtn=`<label class="miss-t"><input type="checkbox" data-dmiss ${state.dMiss?"checked":""}>未取得の魔石も表示<small>${missN}</small></label>`;
  const cards=[...list.map(d=>({d})),...miss].map(({d,sp,n})=>!d?`
    <div class="card box miss"><div class="cl"><b class="nk">${esc(spn(sp))}</b><span class="sp">No.${n}・${rarOf(sp)}</span>${SP[sp]?fieldRow({sp}):""}</div><span class="miss-l">未取得</span></div>`:(()=>{const id="m"+d.no,op=state.dOpen.includes(id);return `
    <div class="card box fold${op?" open":""}" data-acc="${id}" role="button" tabindex="0" aria-expanded="${op}" aria-label="${esc(d.nk)}のくわしい情報">
      <div class="card-h">
        <div class="tt"><b class="nk${[...d.nk].length>=7?" long":""}"><span class="nm">${esc(d.nk)}</span><small class="no">No.${msNo(d.sp)||d.no}</small></b><span class="shape">${esc(spn(d.sp))}</span></div>
        <div class="ci">${illust(d)}</div><div class="cr">${radar(d,{sq:true,icons:false})}</div>
        <span class="chev" aria-hidden="true">${ico("chev")}</span></div>
      <div class="fold-b">${fieldRow(d,true)}
        <h4 class="d-sec">${ico("bolt")}スキル</h4>${skillTable(d.sp,d.sk)}
        <h4 class="d-sec">${ico("shield")}アビリティ</h4>${abilityTable(d.ab)}</div>
    </div>`})()).join("");
  return `<h2><span class="tg">${ico("gem")}</span>相棒の魔石<span class="n">${D.length}体</span></h2><p class="hint">これまで育てた相棒の記録です。合計の高い順</p>${missBtn}<div class="grid">${cards}</div>${viewRank()}`;
}
const dList=()=>orderD();
/* Maxのデータが無ければ、分かっている一番高いレベルのデータを使う。[値, "Lv3"などの札（Maxなら空）] */
function bestLv(L){
  if(!L)return [null,""];
  if(L.M)return [L.M,""];
  const k=Object.keys(L).filter(k=>k!=="M").sort((a,b)=>b-a)[0];
  return k?[L[k],"Lv"+k]:[null,""];
}
const lvNote=t=>t?`<span class="lvb">${t}</span>`:"";
/* ===== 相性（種族ごと） =====
   攻撃属性＝威力のあるスキルの属性。得意＝自分の攻撃属性が弱点の種族、苦手＝自分の弱点の属性で攻撃してくる種族 */
function atkEls(skKey){
  const set=new Set();
  Object.entries(SK[skKey]||{}).forEach(([,db])=>{const[v]=bestLv(db&&db.L);if(db&&db.at&&v&&+v[2]>0)set.add(db.at)});
  return set;
}
const EL_ORDER=["火","水","土","風","光","闇"];
function matchup(g){
  const L=guideList().filter(o=>o!==g);
  const mine=EL_ORDER.filter(a=>atkEls(g.skKey).has(a));
  const head=(a,t)=>`<p class="mu-hd">${elTag(a)}<span>${t}</span></p>`;
  const names=os=>os.length?os.map(o=>esc(spn(o.sp))).join("・"):`<span class="none">なし</span>`;
  const good=mine.map(a=>head(a,"が弱点")+`<p class="mu-l">${names(L.filter(o=>o.p.w===a))}</p>`).join("");
  const w=g.p.w;let bad="";
  if(w){
    bad=head(w,"スキル持ち")+`<p class="mu-l">${names(L.filter(o=>atkEls(o.skKey).has(w)))}</p>`
      +`<button class="mu-go" data-skel="${esc(w)}">${esc(w)}スキル一覧へ ›</button>`;
  }
  if(!good&&!bad)return `<p class="nodata">属性・弱点がまだ分かっていません</p>`;
  return `<div class="mu">${good}${bad}</div>`;
}
/* 追加効果の表示（カード・スキル一覧・アビリティで共通）。短く言い換え、↑は赤・↓は青（よい効果＝赤、わるい効果＝青） */
const fxShort=t=>stShort(fx(t).replace(/。$/,"")
  .replace(/一度だけ状態異常無効化/g,"異常無効×1").replace(/体力(\d+)%以下だと0マナ/g,"体力$1%以下 0マナ")
  .replace(/防御↑が多いほど威力↑/g,"防御↑で威力↑").replace(/発動ターンダメージ0/g,"1ターン無敵")
  .replace(/スタンさせる/g,"スタン").replace(/マナを0にする/g,"マナ0↓").replace(/体力が少ないほど威力が上がる/g,"低体力ほど威力↑").replace(/回避バフが多いほど威力が上がる/g,"回避↑で威力↑").replace(/攻撃が必中になる/g,"必中").replace(/属性が弱点属性になる/g,"弱点属性で攻撃").replace(/デバフを消す/g,"デバフ解除").replace(/攻撃を回避した時、?/g,"回避時").replace(/自分に([小中大])ダメージ/g,"反動$1ダメージ").replace(/素早さ/g,"素早"));
/* ↑↓の付くパラメータ名を体・攻・防・早・命・避に短くする（スキル・アビリティ・カード共通） */
const stShort=t=>t.replace(/素早さ/g,"素早").replace(/(体力|攻撃|防御|素早|命中|回避)(?=(?:[小中大]|\d+)?[↑↓])/g,m=>STATS[["体力","攻撃","防御","素早","命中","回避"].indexOf(m)]);
const arrows=h=>h.replace(/((?:体力|攻撃|防御|素早|命中|回避|体|攻|防|早|命|避|マナ|会心率|異常付与率|威力)?(?:[小中大]|\d+)?)([↑↓])/g,(m,a,b)=>`<span class="${b==="↑"?"up":"dn"}">${a}${b}</span>`);
/* 持続：数値の時だけ効果の後ろに (N) で付ける */
const durNote=v=>/^\d+$/.test(String(v))?`<span class="dur">(${v})</span>`:"";
/* スキルの追加効果：確率の「で」は付けない（例：30%防御小↑(2)） */
const effHTML=(raw,dur)=>raw?arrows(esc(fxShort(raw).replace(/(\d+)%で/g,"$1%")))+durNote(dur):"";
/* スキルの表：スキル・マナ・命中・威力・追加効果 */
function skillTable(spName,list){
  let low=false;
  const rows=list.map(x=>{
    if(x.none)return `<tr><td class="nm" colspan="5"><span class="none">ー（空き）</span></td></tr>`;
    const db=(SK[spName]||{})[x.n],[v,lt]=bestLv(db&&db.L);
    if(lt)low=true;
    const nm=`<td class="nm"><b>${esc(skn(x.n))}${lt?`<span class="lvt">${lt}</span>`:""}</b></td>`;
    if(!v)return `<tr>${nm}<td colspan="4" class="none">値はまだ確かめていません</td></tr>`;
    const eff=v[4]?effHTML(v[4],v[0]):`<span class="none">なし</span>`;
    return `<tr>${nm}<td class="c">${db.at?elTag(db.at):"？"}</td><td class="c">${esc(v[1])}</td><td class="c">${accTag(v[3])}</td><td class="c pw">${esc(v[2])}</td></tr><tr class="sk-e"><td colspan="5" class="ef"><div class="efb">${eff}</div></td></tr>`;
  }).join("");
  return `<div class="xtbl"><table class="sktbl"><thead><tr><th>スキル</th><th class="c">属性</th><th class="c">マナ</th><th class="c">命中</th><th class="c">威力</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}
/* アビリティの表：アビリティ・効果。extra(n) で効果の下に足すもの（覚えているドラゴンなど） */
/* アビリティの持続：スキルと同じく数値の時だけ (N) で付ける。持続のない上昇は何も付けない */
const abDur=d=>durNote(d);
/* Maxの効果を出す。Maxが分からない時だけ、分かっている一番高いLvの効果 */
function abEff(n){
  const [v,lt]=bestLv((AB[n]||{}).L||{});
  return v?(v[1]?arrows(esc(fxShort(v[1]).replace(/(\d+)%で/g,"$1%").replace(/体力(\d+)%以下で/,(m,n)=>n==="0"?"体力0を切る時":`体力${n}%を切る時`))):"")+abDur(v[0])+(lt?`<span class="dur">${lt}</span>`:""):`<span class="none">効果はまだ確かめていません</span>`;
}
function abilityTable(list,extra=abilityTable.none){
  const rows=list.map(x=>{
    if(x.none)return `<tr><td class="nm" colspan="2"><span class="none">ー（空き）</span></td></tr>`;
    const eff=abEff(x.n);
    return `<tr><td class="nm"><b>${esc(abn(x.n))}</b>${x.cnt?`<small class="cnt">${x.cnt}体</small>`:x.cnt===0?`<small class="cnt">未習得</small>`:""}</td><td class="ef">${eff}${extra(x.n)}</td></tr>`;
  }).join("");
  const wide=extra!==abilityTable.none;
  return `<div class="xtbl"><table class="abtbl${wide?" stack":""}">${wide?"":"<thead><tr><th>アビリティ</th><th>効果</th></tr></thead>"}<tbody>${rows}</tbody></table></div>`;
}
abilityTable.none=()=>"";

/* 合計と6つのパラメータを数字と色だけで（800以上は赤、400未満は青） */

/* そのドラゴンの一番威力の高いスキル（同じ威力ならマナの少ない方） */

const GROUPS=[
  ["crown","合計","6つの合計",d=>d.total,d=>esc(spn(d.sp))],
  ["sword","攻撃系","攻＋命",d=>d.st[1].v+d.st[4].v,d=>`攻 ${d.st[1].v}・命 ${d.st[4].v}`],

function viewRank(){

function learnRank(kind,icon,label,keep=()=>true,title="習得ドラゴン数ベスト5"){
  const m={};D.forEach(d=>d[kind].forEach(x=>{if(!x.none&&keep(x.n))(m[x.n]=m[x.n]||[]).push(d)}));
  /* 半分より多いドラゴンが覚えている時は「覚えていないドラゴン」を出す */
  const sub=ds=>ds.length>D.length/2?"覚えていない："+(D.filter(d=>!ds.includes(d)).map(d=>esc(d.nk)).join("・")||"なし"):ds.map(d=>esc(d.nk)).join("・");
  const rows=top5(Object.entries(m).map(([n,ds])=>({name:n,v:ds.length,u:"体",sub:sub(ds)})));
  return {m,card:rows.length?rankCard(icon,title,"覚えている数",rows):null};
}
/* ===== フィールド・属性の札 ===== */
const EL_CLS={火:"e-fire",水:"e-water",土:"e-earth",風:"e-wind",光:"e-light",闇:"e-dark"};
const FD_CLS={荒野:"f-waste",水辺:"f-water",森林:"f-forest",岩場:"f-rock"};
const elTag=e=>e?`<span class="el ${EL_CLS[e]||""}">${esc(e)}</span>`:`<span class="el">？</span>`;
const fdTag=f=>f?`<span class="fd ${FD_CLS[f]||""}">${esc(f)}</span>`:"";
const spOf=d=>SP[d.sp]||{};
/* 魔石No.：排出魔導書の一覧を左の列（N）から順に、上から下へ数えた番号 */
const MASEKI_N=["ワイヴァーン","ペルーダ","ファーヴニル","ベーオウルフ・ドラゴン","ヴィーヴル","聖ゲオルギウス・ドラゴン","リントヴルム","ムシュフシュ","クエレブレ","タラスク","ファイヤー・ドレイク","九頭龍"];
const MASEKI_R=["イルルヤンカシュ","蜃","メスター・ストゥアワーム","ケツァルコアトル","ヒュドラー","フェルニゲシュ","レインボー・サーペント","ゴルィニシチェ","アジ・ダハーカ","ヴリトラ","レヴィアタン","応龍"];
const MASEKI=[...MASEKI_N,...MASEKI_R,...MASEKI_N.map(n=>n+"変異種"),...MASEKI_R.map(n=>n+"変異種")];
const RARITY=["N","R","SR","UR"];
const msNo=sp=>MASEKI.indexOf(sp)+1;               // 見つからない時は0
const rarOf=sp=>{const i=MASEKI.indexOf(sp);return i<0?"":RARITY[Math.floor(i/12)]};
const ACC_CLS={"◎":"acc-a","○":"acc-b","△":"acc-c","×":"acc-d","✕":"acc-d","✖":"acc-d"};
const accTag=v=>ACC_CLS[v]?`<span class="acc ${ACC_CLS[v]}">${esc(v)}</span>`:esc(v);
const noTag=d=>{const n=msNo(d.sp);return n?`No.${n}・${rarOf(d.sp)}`:`No.${d.no}`};
function fieldRow(d,withAttr=false){
  const p=spOf(d);
  return `<div class="fw">${withAttr?`<span class="fw-i"><small>属性</small>${elTag(p.a)}</span><span class="fw-i"><small>弱点</small>${elTag(p.w)}</span><span class="fw-i"><small>得意</small>${fdTag(p.f)||"？"}</span></div>`:""}${withAttr?"":`<span class="fw-i"><small>得意</small>${fdTag(p.f)}</span><span class="fw-i"><small>弱点</small>${elTag(p.w)}</span></div>`}`;
}

const FIELDS=["持続","マナ","威力","命中"];


/* ドラゴンを選ぶ帯（スキル・情報タブ） */
function pickStrip(attr,sel,list=D){
  list=orderD(list);
  if(!list.length)return `<p class="nodata">当てはまるドラゴンはいません</p>`;
  return `<div class="pick">${list.map(d=>`<button data-${attr}="${d.no}" aria-pressed="${sel===d.no}">${illust(d)}<span>${esc(d.nk)}</span></button>`).join("")}</div>`;
}
/* Maxの値が分かっているスキルを全部集める */
function skillRows(){
  const out=[];
  D.forEach(d=>d.sk.forEach(x=>{
    const db=(SK[d.sp]||{})[x.n];if(!db)return;
    const [v,lt]=bestLv(db.L);if(!v)return;
    const pct=(v[4].match(/(\d+)%の確率/)||[])[1];
    out.push({d,n:x.n,lt,at:db.at,dur:v[0],mana:+v[1]||0,pow:+v[2]||0,acc:v[3],pct:pct?+pct:null,eff:v[4]});
  }));
  /* まだ持っていない種族のスキル（未習得） */
  const have=new Set(D.map(d=>d.sp));
  Object.entries(SK).filter(([sp])=>!have.has(sp)).forEach(([sp,o])=>Object.entries(o).forEach(([n,db])=>{
    const [v,lt]=bestLv(db.L);if(!v)return;
    out.push({d:null,sp,n,lt,at:db.at,dur:v[0],mana:+v[1]||0,pow:+v[2]||0,acc:v[3],pct:null,eff:v[4]});
  }));
  return out;
}
/* 補足の1行：ランキングの値以外の「威力・マナ・命中」と追加効果を短く */
function skInfo(r,skip){
  const parts=[["威力","pow",r.pow],["マナ","mana",r.mana],["命中","acc",r.acc]].filter(([,k])=>!skip.includes(k)).map(([n,k,v])=>`${n}<b>${k==="acc"?accTag(v):esc(v)}</b>`);
  const e=effHTML(r.eff,r.dur);
  return `<span class="ski">${parts.join(" ")}</span>${e?`<span class="ske">${e}</span>`:""}`;
}
/* 追加効果での分類。上から順に当てはめる */
/* 追加効果での分類。上から順に当てはめる。猛毒→毒、大やけど→火傷、強麻痺→麻痺、裂傷→傷 */
const SK_CATS=["通常","毒","火傷","麻痺","傷","スタン","マナ↑","マナ↓","パラ↑","パラ↓","回復","補助","無敵","その他"];
function skCat(r){
  const e=r.eff||"";
  if(!e)return r.pow>0?"通常":"その他";
  if(/毒状態/.test(e))return "毒";
  if(/やけど状態/.test(e))return "火傷";
  if(/麻痺状態/.test(e))return "麻痺";
  if(/傷状態/.test(e))return "傷";
  if(/スタン/.test(e))return "スタン";
  if(/ダメージを0/.test(e))return "無敵";
  if(/状態異常を無効|付与率/.test(e))return "補助";
  if(/自分のマナ/.test(e))return "マナ↑";
  if(/相手のマナ/.test(e))return "マナ↓";
  if(/自分の(攻撃|防御|素早さ|命中|回避)[をが].*アップ/.test(e))return "パラ↑";
  if(/相手の(攻撃|防御|素早さ|命中|回避)[をが].*ダウン/.test(e))return "パラ↓";
  if(/回復/.test(e))return "回復";
  return "その他";
}
function skillList(){
  /* ニックネームは出さず種族名で載せるので、同じ種族の同じスキルは1行にまとめる */
  const seenSk=new Set(),allR=skillRows().filter(r=>{const k=(r.d?r.d.sp:r.sp)+"|"+r.n;if(seenSk.has(k))return false;seenSk.add(k);return true});
  const els=EL_ORDER.filter(a=>allR.some(r=>r.at===a));
  const el=els.includes(state.skEl)?state.skEl:"all";
  const echips=`<div class="sorter flt"><span class="flt-l">属性</span><button data-skel="all" aria-pressed="${el==="all"}">すべて<small>${allR.length}</small></button>${els.map(a=>`<button data-skel="${a}" aria-pressed="${el===a}">${elTag(a)}<small>${allR.filter(r=>r.at===a).length}</small></button>`).join("")}</div>`;
  const all=el==="all"?allR:allR.filter(r=>r.at===el);
  /* 絞り込みは表の列と同じ 属性→マナ→命中→威力→効果 の順に重ねる。選んだ値が無くなった時は「すべて」に戻す */
  const ACC_ORD=["◎","○","△","×","-"];
  const step=(list,label,attr,cur,get,vals,fmt=v=>esc(v))=>{
    const ok=vals.some(v=>String(v)===String(cur));
    const out=ok?list.filter(r=>String(get(r))===String(cur)):list;
    const chips=`<div class="sorter flt"><span class="flt-l">${label}</span><button data-${attr}="all" aria-pressed="${!ok}">すべて<small>${list.length}</small></button>${vals.map(v=>{const n=list.filter(r=>String(get(r))===String(v)).length;return `<button data-${attr}="${esc(v)}" aria-pressed="${ok&&String(v)===String(cur)}">${fmt(v)}<small>${n}</small></button>`}).join("")}</div>`;
    return [out,chips];
  };
  const uniq=(list,get,sort)=>[...new Set(list.map(get))].sort(sort);
  const [byM,mchips]=step(all,"マナ","skmana",state.skMana,r=>r.mana,uniq(all,r=>r.mana,(a,b)=>b-a));
  const [byA,achips]=step(byM,"命中","skacc",state.skAcc,r=>r.acc,uniq(byM,r=>r.acc,(a,b)=>ACC_ORD.indexOf(a)-ACC_ORD.indexOf(b)),v=>v==="-"?"なし":accTag(v));
  const [byP,pchips]=step(byA,"威力","skpow",state.skPow,r=>r.pow,uniq(byA,r=>r.pow,(a,b)=>b-a));
  const [rows,cchips]=step(byP,"効果","skcat",state.skCat,skCat,SK_CATS.filter(k=>byP.some(r=>skCat(r)===k)));
  /* 並び順は固定：通常種→変異種の順、通常種のナンバー順 */
  const keyNo=r=>msNo(r.d?r.d.sp:r.sp)*1000+(r.d?r.d.no:0),ix=new Map(allR.map((r,i)=>[r,i]));
  rows.sort((a,b)=>keyNo(a)-keyNo(b)||ix.get(a)-ix.get(b));
  const list=rows.length?`<div class="box sklist"><div class="xtbl"><table class="sktbl"><thead><tr><th>スキル・種族</th><th class="c">属性</th><th class="c">マナ</th><th class="c">命中</th><th class="c">威力</th></tr></thead><tbody>${
    rows.map(r=>{const e=effHTML(r.eff,r.dur);
      const op=r.d?` data-open="${r.d.no}"`:` class="unown"`;
      return `<tr${op}><td class="nm"><b>${esc(skn(r.n))}${r.lt&&r.d?`<span class="lvt">${r.lt}</span>`:""}</b><small class="cnt">${r.d?esc(spn(r.d.sp)):`<span class="nw">${esc(spn(r.sp))}</span> <span class="nw">未習得${r.lt?" "+r.lt:""}</span>`}</small></td><td class="c">${r.at?elTag(r.at):"？"}</td><td class="c">${r.mana}</td><td class="c">${accTag(r.acc)}</td><td class="c pw">${r.pow}</td></tr>${e?`<tr class="sk-e${r.d?"":" unown"}"${r.d?` data-open="${r.d.no}"`:""}><td colspan="5" class="ef"><div class="efb">${e}</div></td></tr>`:""}`}).join("")
  }</tbody></table></div></div>`:`<p class="nodata">当てはまるスキルはありません</p>`;
  return echips+mchips+achips+pchips+cchips+list;

}
/* ===== ドラゴン別スキル：通常種と変異種を1枚のカードに =====
   スキルごとに 上の行＝通常種・下の行＝変異種（属性・マナ・命中・威力）。追加効果は2行の下にまとめ、同じなら1行。
   変異種で通常種と値が変わったところは薄く色をつける */
function speciesSkillCards(){
  const bases=MASEKI_N.concat(MASEKI_R).filter(b=>SK[b]||SK[b+"変異種"]);
  const cell=(v,k,o)=>{const val=k==="at"?v.at:v.v[{mana:1,acc:3,pow:2}[k]];
    const html=k==="at"?(val?elTag(val):"？"):k==="acc"?accTag(val):esc(val);
    const other=o?(k==="at"?o.at:o.v[{mana:1,acc:3,pow:2}[k]]):undefined;
    return `<td class="c${o&&String(other)!==String(val)?" df":""}">${html}</td>`};
  const row=(label,v,o,cls)=>v
    ?`<tr class="rw ${cls}"><td class="kd">${label}${v.lt?`<span class="lvt">${v.lt}</span>`:""}</td>${["at","mana","acc","pow"].map(k=>cell(v,k,cls==="rv"?o:null)).join("")}</tr>`
    :`<tr class="rw ${cls}"><td class="kd">${label}</td><td colspan="4" class="nod">データなし</td></tr>`;
  return `<div class="spgrid">${bases.map(b=>{
    const vb=b+"変異種",A=SK[b]||{},B=SK[vb]||{};
    const names=[...new Set([...Object.keys(A),...Object.keys(B)])];
    const get=(db,n)=>{const x=db[n];if(!x)return null;const [v,lt]=bestLv(x.L);return v?{at:x.at,v,lt}:null};
    const rows=names.map(n=>{
      const a=get(A,n),c=get(B,n);
      const ea=a?effHTML(a.v[4],a.v[0]):"",ec=c?effHTML(c.v[4],c.v[0]):"";
      const none=`<span class="none">なし</span>`;
      let ef;
      if(a&&c&&a.v[4]===c.v[4]&&String(a.v[0])===String(c.v[0]))ef=`<div><i>共通</i><span>${ea||none}</span></div>`;
      else ef=(a?`<div><i>通常</i><span>${ea||none}</span></div>`:"")+(c?`<div><i>変異</i><span>${ec||none}</span></div>`:"");
      return `<tr class="sn"><td colspan="5">${esc(n)}</td></tr>${row("通常",a,null,"rn")}${row("変異",c,a,"rv")}${ef?`<tr class="ex"><td colspan="5"><div class="efb">${ef}</div></td></tr>`:""}`;
    }).join("");
    return `<div class="box spc"><div class="spc-h"><b>${esc(b)}</b></div><div class="xtbl"><table class="sktbl sptbl"><thead><tr><th class="kd"></th><th class="c">属性</th><th class="c">マナ</th><th class="c">命中</th><th class="c">威力</th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
  }).join("")}</div>`;
}
function viewSkill(){
  const missing=[...new Set(D.filter(x=>!SK[x.sp]).map(x=>x.sp))].map(sp=>esc(spn(sp))).join("・");
  return `<h2><span class="tg">${ico("bolt")}</span>ドラゴン別スキル</h2><p class="hint">通常種と変異種を1枚にまとめています。上の行が通常種、下の行が変異種。変異種で値が変わったところに色をつけています。値はMaxです（分からないものはLvを表示）</p><button class="go-down" data-skjump>スキル一覧へ ↓</button>${speciesSkillCards()}
    <h2 id="sk-list"><span class="tg">${ico("bolt")}</span>スキル一覧</h2><p class="hint">はじめは通常種→変異種の順に、通常種のナンバー順で並びます。値はMaxです（Maxが分からないものはLvを表示）。「未習得」はまだ持っていない種族のスキルです</p>${skillList()}
    ${missing?`<p class="hint" style="margin-top:10px">まだデータがないドラゴン：${missing}</p>`:""}`;
}

/* ===== アビリティ =====
   分類：上がるパラメータごと（攻撃・防御・素早さ・命中・回避）と体力・マナ・状態。どれにも入らないものは「その他」
   新しいアビリティは AB_CAT に1行足す。足していない時は効果の文から自動で振り分ける */
const AB_CATS=["攻撃","防御","素早さ","命中","回避","体力","マナ","状態","その他"];
const AB_CAT={"気合の攻め":"攻撃","素早さアップ":"素早さ","アドリブ":"攻撃","見切りの極意":"回避","応急処置":"体力","リセット":"状態","クリティカル":"攻撃","追加攻撃":"攻撃","健康キラー":"攻撃","狙い撃ち":"命中",
  "リカバリー":"体力","ふんばる":"体力","マナアップ":"マナ","緊急チャージ":"マナ","フクツの意志":"マナ","回復チャージ":"体力","追加チャージ":"マナ","デトックス":"状態","マナセラピー":"状態"};
function abCat(n){
  if(AB_CAT[n])return AB_CAT[n];
  const db=AB[n];const e=db?Object.values(db.L).map(v=>v[1]).join(""):"";
  const m=e.match(/(攻撃|防御|素早さ|命中|回避)が[小中大]アップ/);
  return m?m[1]:"その他";
}
/* 名前別の分類：名前の付き方で分ける（上から順に当てはめる） */

  const groups=RR_ORD.map(rr=>{const A=AF.filter(r=>r.rr===rr);if(!A.length)return"";const L=A.filter(r=>r.v);
    const avg=L.length?Math.round(L.reduce((a,r)=>a+spvTot(r),0)/L.length):0;
    return `<h3 class="bk-h"><span class="rr rr-${rr}">${rr}</span><span class="n">${A.length}種${L.length?`・測った${L.length}種の合計の平均 ${avg}`:""}</span></h3><div class="bk-g">${[...L,...A.filter(r=>!r.v)].map(r=>card(r)).join("")}</div>`}).join("");
  const ty=[...new Set(AF.map(spvType))].sort((a,b)=>tyOrd(a)-tyOrd(b));
  const types=ty.map(t=>{const L=AF.filter(r=>spvType(r)===t).sort((a,b)=>RR_ORD.indexOf(a.rr)-RR_ORD.indexOf(b.rr));
    return `<h3 class="bk-h">${t}<span class="n">${L.length}種</span></h3><div class="bk-g">${L.map(r=>card(r,1)).join("")}</div>`}).join("");
  const tyBtn=["all",...TYS].map(k=>{const n=k==="all"?AR.length:AR.filter(r=>spvType(r)===k).length;
    return `<button data-bkty="${esc(k)}" aria-pressed="${ft===k}"${n?"":" disabled"}>${k==="all"?"全部":esc(k==="種族値未調査"?"未分類":k.replace(/型$/,"").replace("逃切り","逃切"))}<small class="cnt">${n}</small></button>`}).join("");
  return `<div class="sorter bk-rr">${["all",...RR_ORD].map(k=>`<button data-bkrr="${k}" aria-pressed="${fr===k}">${k==="all"?"すべて":k}<small class="cnt">${k==="all"?ALL.length:ALL.filter(r=>r.rr===k).length}</small></button>`).join("")}</div>
  <div class="sorter bk-rr bk-ty">${tyBtn}</div>
  <h2><span class="tg">${ico("hex")}</span>タイプ別の種族値</h2>
  ${types}
  <h2><span class="tg">${ico("tome")}</span>レアリティ別の種族値</h2>
  ${groups}`;
}
document.addEventListener("click",e=>{const r=e.target.closest("[data-bkrr]");if(r){state.bkRr=r.dataset.bkrr;save();render();return}
  const t=e.target.closest("[data-bkty]");if(t&&!t.disabled){state.bkTy=t.dataset.bkty;save();render();return}});
const VIEWS={dragon:viewDragon,maseki:viewMaseki,skill:viewSkill,ability:viewAbility,card:viewCard,battle:viewBattle,sim:viewSim,book:viewBook};
const view=document.getElementById("view");
function render(){
  document.querySelectorAll("nav.views button").forEach(t=>t.setAttribute("aria-selected",t.dataset.tab===state.tab));
  
  view.innerHTML=VIEWS[state.tab]();
}
function go(tab,detail=null){
  const same=state.tab===tab&&!detail&&!state.detail;
  if(state.tab==="maseki"&&!same)state.dScroll=window.scrollY;  /* 魔石タブの一覧の位置を覚えておく */
  state.tab=tab;state.detail=detail;
  try{history.replaceState(null,"","#"+(detail?"d"+detail:tab))}catch(e){}
  render();
  if(tab==="maseki"&&!detail&&!same&&state.dScroll){window.scrollTo({top:state.dScroll});return}
  if(!same){const nav=document.querySelector("nav.views"),top=Math.max(0,view.getBoundingClientRect().top+window.scrollY-nav.offsetHeight-8);if(window.scrollY>top)window.scrollTo({top})}
}
document.addEventListener("change",e=>{
  if(e.target.matches("[data-dmiss]")){state.dMiss=e.target.checked;save();render()}
});
document.addEventListener("click",e=>{
  if(e.target.closest("[data-skjump]")){const el=document.getElementById("sk-list"),nav=document.querySelector("nav.views");if(el)window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-nav.offsetHeight-8,behavior:"smooth"});return}
  const t=e.target.closest("[data-tab],[data-open],[data-back],[data-dsort],[data-abcat],[data-img],[data-rk],[data-skmana],[data-skpow],[data-skacc],[data-skel],[data-sksort],[data-skcat],[data-gty],[data-acc],[data-rx]");
  if(!t)return;const ds=t.dataset;
  /* アコーディオン：その場で開け閉めする（描き直さない） */
  if(ds.rx){const on=!t.classList.contains("open");t.classList.toggle("open",on);t.setAttribute("aria-expanded",on);return}
  if(ds.acc){const n=ds.acc,card=t,on=!card.classList.contains("open");
    card.classList.toggle("open",on);t.setAttribute("aria-expanded",on);
    state.dOpen=on?[...state.dOpen,n]:state.dOpen.filter(x=>x!==n);return}
  if(ds.tab)return go(ds.tab);
  if(ds.open)return go("maseki",+ds.open);
  if("back" in ds)return go("maseki");
  
  if(ds.skel){state.skEl=ds.skel;
    if(state.tab!=="skill"){state.skMana="all";state.skCat="all";state.skPow="all";state.skAcc="all";save();return go("skill")}  /* カードから来た時は属性だけで絞る */
    save();return render()}
  if(ds.skmana){state.skMana=ds.skmana;save();return render()}
  if(ds.skcat){state.skCat=ds.skcat;save();return render()}
  if(ds.skpow){state.skPow=ds.skpow;save();return render()}
  if(ds.skacc){state.skAcc=ds.skacc;save();return render()}
  if(ds.rk){const [tb,k]=ds.rk.split("|");state.rk={...state.rk,[tb]:k};save();return render()}
  if(ds.img){state.img=ds.img;save();return render()}
  if(ds.dsort)return toggle(state.dSort,ds.dsort,ds.dsort==="no"?1:-1);
  if(ds.abcat){state.abCat=ds.abcat;save();return render()}
  if(ds.gty){state.gTy=ds.gty;save();return render()}
});
/* #maseki #skill #ability #d4 などで直接ひらける（#status は前の名前） */
const h=(location.hash||"").slice(1).replace(/^status$/,"maseki");
if(VIEWS[h])state.tab=h;else if(/^d\d+$/.test(h)&&D.find(d=>d.no===+h.slice(1))){state.tab="maseki";state.detail=+h.slice(1)}
render();
</script>
</body>
</html>
